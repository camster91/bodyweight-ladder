<script>
/* LADDER_SUPPORT_START */
/* Minimal diagnostics: memory only, never workout data or automatic uploads. */
window.LadderSupport=(()=>{
 'use strict';
 const RELEASE='2026-10-26-compact-exercise-details',events=[];
 const screen=()=>['today','ladders','history','setup'].includes(document.body?.dataset.view)?document.body.dataset.view:'setup';
 function record(kind,line=0,column=0){
  if(!['runtime','promise','image','script','stylesheet','storage'].includes(kind))return;
  const item={kind,screen:screen(),line:Number.isInteger(line)?Math.max(0,Math.min(line,999999)):0,column:Number.isInteger(column)?Math.max(0,Math.min(column,999999)):0};
  const key=JSON.stringify(item),old=events.find(e=>e.key===key);
  if(old){old.count=Math.min(99,old.count+1);return;}
  if(events.length>=20)events.shift();
  events.push({...item,key,count:1});
  if(document.readyState!=='loading')showNotice();
 }
 function snapshot(){
  return {release:RELEASE,screen:screen(),online:navigator.onLine,viewport:{width:innerWidth,height:innerHeight},capabilities:{dialog:typeof HTMLDialogElement!=='undefined',wakeLock:'wakeLock' in navigator},events:events.map(({key,...item})=>({...item}))};
 }
 function showNotice(){
  if(!events.length||document.getElementById('appProblemNotice'))return;
  const target=document.querySelector('.wrap');if(!target)return;
  const notice=document.createElement('section');notice.id='appProblemNotice';notice.className='app-problem-notice';notice.setAttribute('role','status');
  notice.innerHTML='<p>Something didn’t load or run correctly.</p><button data-support-open>Report a problem</button><button data-support-dismiss aria-label="Dismiss problem notice">Dismiss</button>';
  target.prepend(notice);
 }
 function open(opener=document.activeElement){
  if(document.getElementById('appSupport'))return;
  const d=document.createElement('dialog');d.id='appSupport';d.className='app-preferences app-support';d.setAttribute('aria-labelledby','supportTitle');
  d.innerHTML='<div class="preferences-head"><h2 id="supportTitle">Report a problem</h2><button data-support-close aria-label="Close problem report" autofocus>×</button></div><p>Tell us what happened and what you expected. If progress looks wrong, back it up before refreshing.</p><label for="supportMessage">What went wrong?</label><textarea id="supportMessage" maxlength="3000" placeholder="What were you trying to do?"></textarea><label class="support-consent"><input type="checkbox" data-support-include> Include the technical details shown below</label><a class="lui lui-button" data-support-report>Email a private report</a><p>Your email app opens a draft to <strong>hello@ashbi.ca</strong>. Nothing is sent until you send it. No GitHub account needed.</p><p>If no email app opens, copy your message into an email to hello@ashbi.ca. Please leave out health details and progress backups.</p><details><summary>Review technical details</summary><p>Optional. No workout history, error messages, account details or saved progress are included.</p><textarea readonly aria-label="Technical details" spellcheck="false" data-support-details></textarea><div class="support-actions"><button data-support-copy>Copy report</button><button data-support-clear>Clear errors</button></div></details><p data-support-status role="status" aria-live="polite"></p>';
  const details=d.querySelector('[data-support-details]'),message=d.querySelector('#supportMessage'),include=d.querySelector('[data-support-include]'),status=d.querySelector('[data-support-status]');
  const report=()=> 'Bodyweight Ladder problem\n\n'+(message.value.trim()||'What happened?\n\nWhat did you expect?\n\nSteps to reproduce:')+(include.checked?'\n\nTechnical details:\n'+details.value:'');
  function refresh(){
   const info=JSON.stringify(snapshot(),null,2);details.value=info;
   d.querySelector('[data-support-report]').href='mailto:hello@ashbi.ca?subject='+encodeURIComponent('Bodyweight Ladder — problem report')+'&body='+encodeURIComponent(report());
  }
  refresh();
  const copyButton=d.querySelector('[data-support-copy]');d.querySelector('[data-support-report]').after(copyButton);copyButton.className='support-copy';
  message.addEventListener('input',refresh);include.addEventListener('change',refresh);
  d.querySelector('[data-support-close]').onclick=()=>d.close();
  d.querySelector('[data-support-copy]').onclick=async()=>{
   try{await navigator.clipboard.writeText(report());status.textContent='Report copied. Paste it into an email to hello@ashbi.ca.';}
   catch(_){const copy=document.createElement('textarea');copy.value=report();copy.setAttribute('aria-label','Report to copy');d.append(copy);copy.focus();copy.select();status.textContent='Select and copy the report below using your device’s Copy control.';}
  };
  d.querySelector('[data-support-clear]').onclick=()=>{events.length=0;document.getElementById('appProblemNotice')?.remove();refresh();status.textContent='Error details cleared from this page.';};
  d.addEventListener('close',()=>{d.remove();if(opener?.isConnected)opener.focus({preventScroll:true});},{once:true});
  document.body.append(d);if(typeof applyComponentSystem==='function')applyComponentSystem(d);d.showModal();
 }
 window.addEventListener('error',e=>{
  if(e.target&&e.target!==window){const kind={IMG:'image',SCRIPT:'script',LINK:'stylesheet'}[e.target.tagName];if(kind)record(kind);return;}
  let own=false;try{const url=new URL(e.filename,location.href);own=url.origin===location.origin&&['/','/index.html'].includes(url.pathname);}catch(_){}
  record('runtime',own?e.lineno:0,own?e.colno:0);
 },true);
 window.addEventListener('unhandledrejection',()=>record('promise'));
 document.addEventListener('click',e=>{
  const trigger=e.target.closest('[data-support-open]');if(trigger)open(trigger);
  if(e.target.closest('[data-support-dismiss]'))document.getElementById('appProblemNotice')?.remove();
 });
 document.addEventListener('DOMContentLoaded',showNotice,{once:true});
 return Object.freeze({open,record,snapshot});
})();
/* LADDER_SUPPORT_END */
</script>

<title>Bodyweight Ladder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow column, sticky tab bar at the bottom, cards = one exercise track each */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --ink:#16201B; --muted:#5C6B63; --line:#D5DDD8;
  --accent:#1F55C9; --accent-ink:#FFFFFF; --good:#1E7A4A; --good-bg:#DDF1E5; --chip:#E3E9F7; --bad:#B3261E; --toast-bg:#16201B; --toast-fg:#F3F6F4;
  --art-bg:#EEF2F8; --art-filter:none;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#18201B; --ink:#E8EEEA; --muted:#94A39B; --line:#2B3630; --art-bg:#CED7E5; --art-filter:brightness(.78);
  --accent:#7FA2FF; --accent-ink:#0C1530; --good:#6FD39C; --good-bg:#173226; --chip:#1E2A44; --bad:#FF8A80; --toast-bg:#2E3A33; --toast-fg:#E8EEEA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#18201B; --ink:#E8EEEA; --muted:#94A39B; --line:#2B3630; --art-bg:#CED7E5; --art-filter:brightness(.78);
  --accent:#7FA2FF; --accent-ink:#0C1530; --good:#6FD39C; --good-bg:#173226; --chip:#1E2A44; --bad:#FF8A80; --toast-bg:#2E3A33; --toast-fg:#E8EEEA; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}

  .set{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(64px,90px) auto;gap:6px;align-items:center}

  .seg.mins button{font-size:14px;padding:0 2px}}

.step-name{hyphens:auto;-webkit-hyphens:auto}

.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 6px 6px 18px;display:flex;align-items:center;gap:8px;z-index:8;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.timer #timerText{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;min-width:58px;white-space:nowrap}
.timer button{border-color:transparent;background:rgba(255,255,255,.18);color:inherit;padding:8px 12px;min-height:38px;border-radius:999px}
.chips-label{align-self:center;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;flex:0 0 auto;margin-right:2px}
.chip.rt[aria-pressed="false"]{border-style:dashed}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow>span{flex:1;min-width:0;display:flex;flex-direction:column}

/* --- Today --- */
.dot{width:10px;height:10px;min-height:0;padding:0;border:0;border-radius:50%;flex:0 0 auto;background:var(--line);box-shadow:0 0 0 14px transparent;position:relative}
.dot::after{content:"";position:absolute;inset:-17px}

button.icon{min-width:44px;min-height:44px;padding:0;font-size:16px;flex:0 0 auto}
/* --- logging card --- */
.pic{width:96px!important;height:96px!important;flex:0 0 96px!important}
.holdbtn{width:100%;min-height:56px;font-size:17px;background:var(--chip);border-color:var(--accent);color:var(--accent);font-weight:700}

.between{align-items:center;justify-content:space-between;flex-wrap:nowrap}

.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;border-radius:16px!important;background:var(--toast-bg);color:var(--toast-fg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* Workout-first shell: keep the controls close and reveal technique on demand. */
:root{--bg:#F5F6F8;--surface:#FFFFFF;--ink:#182230;--muted:#596778;--line:#E0E5EC;--chip:#EDF2FC;--good-bg:#EAF5EE;--good:#26734A;--display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161D;--surface:#1A222D;--ink:#F0F3F8;--muted:#A2AFBF;--line:#303B4A;--chip:#25354F;--good-bg:#203D30;--good:#8BDBAA}}
:root[data-theme="dark"]{--bg:#11161D;--surface:#1A222D;--ink:#F0F3F8;--muted:#A2AFBF;--line:#303B4A;--chip:#25354F;--good-bg:#203D30;--good:#8BDBAA}
*,*::before,*::after{box-sizing:border-box}
body{font-size:15px;line-height:1.5}
.wrap{max-width:720px;padding:24px 20px 116px}
header.top{margin-bottom:28px;gap:12px}
header.top img{width:28px;height:28px;border-radius:8px;opacity:.95}
h1{font-size:27px;line-height:1.2;font-weight:650;letter-spacing:-.04em;text-transform:none}
h2{font-size:20px;line-height:1.3;font-weight:650;letter-spacing:-.025em;text-transform:none}
.label{font-size:12px;letter-spacing:.06em;font-weight:600;color:var(--muted)}
.date{font-size:12px}
.card{border:1px solid var(--line);border-radius:16px;padding:24px;gap:18px}
.card.first{border:1px solid var(--line);box-shadow:0 4px 24px #10254505}
button{font-size:14px;font-weight:600;border-width:1px;border-radius:9px;min-height:44px}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.set input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.planbar{display:flex;flex-direction:row;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:26px}
.minrow{flex:1;min-width:230px;gap:12px}
.seg{border-radius:9px;border-color:var(--line);background:var(--surface)}
.seg.mins button{min-height:44px;font-size:13px}
.showbtn{width:auto;min-width:180px;min-height:42px;font-size:13px;background:var(--surface)}
.session-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
.planline{margin:5px 0 0;font-size:15px;color:var(--ink)}
.planline b{font-size:inherit;color:inherit}
.saved-count{color:var(--good);font-size:12px;text-align:right;max-width:150px}
.track-head{align-items:flex-start;gap:10px}
.track-head .label{font-size:11px;letter-spacing:.035em}
.target{font-size:12px;background:var(--chip);color:var(--accent);padding:5px 9px;border-radius:6px;white-space:normal;text-align:center}
.rung{gap:3px;margin-top:8px}
.rung i{height:3px}
.workout-title{margin:0}
.step-name{font-size:clamp(23px,3vw,32px);font-weight:650;line-height:1.18;letter-spacing:-.04em;margin:0 0 10px;text-transform:none}
.cue{font-size:14px;line-height:1.6;margin:0;color:var(--muted)}
.gear{display:block;margin-top:5px;font-size:12px}
.set-progress{margin:0;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.sets{gap:10px}
.sets>.set{padding:10px 8px;background:var(--bg);border:1px solid transparent;border-radius:11px;gap:8px;display:flex!important}
.set.set-active{border-color:var(--accent);background:var(--surface)}
.set.set-done{background:var(--good-bg)}
.set label{font-size:12px;display:flex;justify-content:space-between;gap:3px;flex-wrap:wrap;color:var(--muted)}
.set label span{font-size:11px;float:none;color:var(--muted)}
.set input{width:100%;background:transparent!important;border:0!important;color:var(--ink);font-size:30px!important;min-height:48px;border-radius:6px;font-variant-numeric:tabular-nums}
.set input.hit{background:transparent;color:var(--ink)}
.pm{gap:4px}
.pm button{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:19px;min-height:44px}
.set-check{padding:4px 2px;min-height:44px;background:transparent;border-color:transparent;font-size:12px;white-space:nowrap;color:var(--muted)}
.set-check[aria-pressed="true"]{color:var(--good);background:transparent;border-color:transparent}
.workout-actions{gap:10px;margin:0}
.workout-actions .primary{min-height:48px;flex:1}
.workout-actions .ghost{font-size:13px;color:var(--muted)}
.save-hint{font-size:11px;color:var(--muted);margin:0;text-align:center}
.technique{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-size:14px;font-weight:600;min-height:44px;align-content:center}
.technique summary{color:var(--accent)}
.technique .exercise-figure{margin-top:12px}
.technique .video{margin-top:10px;display:inline-flex;font-size:13px}
.last{font-size:12px;border:0;padding-top:0;color:var(--muted)}
.queue-heading{font-size:14px;font-weight:600;margin:12px 0 0;letter-spacing:0}
.session-main,.session-queue{min-width:0}.session-queue{display:flex;flex-direction:column;gap:12px}.session-main>.card{width:100%}
.mini{padding:14px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;gap:12px}
.mini img{width:44px;height:44px;flex-basis:44px;border-radius:8px}
.mini-t b{font-size:14px;font-weight:600;line-height:1.4}
.mini-t span{font-size:12px;line-height:1.5}
.mini .chev{font-size:12px}
.stack{gap:12px}
.fold{border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 0;font-size:13px}
.sect{margin-top:20px;margin-bottom:0}
.exrow{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0;background:transparent}
.exrow img{width:44px;height:44px;flex-basis:44px;border-radius:8px}
.exopen{border:1px solid var(--line);padding:0 16px;border-radius:12px}
#routinesCard{border:0;background:transparent;padding:0!important}
#routinesCard .exrow{border-bottom:1px solid var(--line);padding:0 0 18px}
.search input{background:var(--surface);border-width:1px;border-radius:9px;font-size:14px;padding:14px}
.custom-exercise{display:block;background:transparent;border:1px dashed var(--line);box-shadow:none}
.custom-exercise[open] summary{margin-bottom:14px}
.custom-exercise .addform{margin-top:16px}
.empty{padding:36px 24px;background:transparent;border:0;align-items:center;gap:16px}
.empty img{width:64px;height:64px;margin:0 auto}
.empty h2{color:var(--ink);font-size:22px}
.empty p{font-size:14px;max-width:38ch;margin:0}
.empty button{max-width:260px;width:100%;margin:0!important}
.setup{gap:16px;padding-bottom:36px}
.setup-intro{padding:16px 0 8px}
.setup-intro h2{font-size:34px;line-height:1.1;max-width:14ch;margin:12px 0;letter-spacing:-.045em}
.setup-intro p{max-width:45ch}
.setup .sect{margin-top:18px;line-height:1.7}
.setup .tog{font-size:13px}
body.in-setup .sticky-actions{position:sticky;bottom:0;border-top:1px solid var(--line);border-radius:0;background:var(--bg);padding:16px 0;margin-top:12px}
.note{font-size:11px;color:var(--muted);margin-top:28px}
button.small,.addform input,.addform select{min-height:44px}
button.dot{width:44px;height:44px;min-height:44px;background:transparent;box-shadow:none}
button.dot::after{inset:17px;border-radius:50%;background:var(--line)}
button.dot.ok::after{background:var(--good)}button.dot.syncing::after{background:var(--accent)}button.dot.error::after{background:var(--bad)}button.dot.readonly::after{background:var(--muted)}
nav .tabs{max-width:680px;gap:8px;padding:7px 0}
nav button{font-family:var(--body);font-size:12px;text-transform:none;letter-spacing:0;font-weight:600;min-height:48px;border-radius:9px;color:var(--muted);padding:10px}
nav button[aria-current="true"]{border:0;background:var(--chip);color:var(--accent);box-shadow:none}
.nav-brand{display:none}
.timer{border-radius:12px;padding:8px 10px 8px 16px;max-width:calc(100vw - 24px);gap:8px;background:var(--ink);color:var(--surface);box-shadow:0 8px 32px #0002}
.timer #timerText{font-family:var(--body);font-size:23px;font-weight:600}
.timer .tlabel{font-size:10px;letter-spacing:.03em}
.timer button{font-size:12px;border-radius:7px;padding:8px;min-width:44px}
.toast{border-radius:10px!important;font-size:13px;max-width:calc(100vw - 32px);white-space:normal}
.toast button{min-height:44px}
@media(hover:hover) and (pointer:fine){button:not([aria-pressed="true"]):not([aria-current="true"]):hover{filter:brightness(.96)}summary:hover{color:var(--accent)}}
@media(prefers-reduced-motion:no-preference){button,a,summary{transition:background-color .16s,color .16s,border-color .16s}.set{transition:background-color .16s,border-color .16s}}
@media(max-width:420px){.wrap{padding:18px 16px 112px}.card{padding:18px;gap:16px}.planbar{gap:10px;margin-bottom:22px}.showbtn{width:100%}.sets{gap:6px}.sets>.set{padding:8px 5px}.step-name{font-size:26px}.set label{font-size:11px}.session-heading{margin-bottom:16px}}
@media(max-width:360px){.sets>.set{display:grid!important;grid-template-columns:32px 34px minmax(72px,1fr) 62px;gap:5px;align-items:center;padding:8px 4px}.set label{grid-column:1;grid-row:1;gap:4px;white-space:normal}.set input{grid-column:2;grid-row:1;font-size:24px!important;padding:4px 0!important}.set .pm{grid-column:3;grid-row:1;gap:4px}.pm button{width:auto;flex:1;min-width:0;font-size:18px}.set-check{grid-column:4;grid-row:1;font-size:11px;white-space:normal}.workout-actions{flex-wrap:wrap}}
@media(min-width:1100px){
 .wrap{max-width:1240px;margin-left:224px;margin-right:auto;padding:42px 48px 70px}
 header.top{margin-bottom:36px}header.top img{display:none}h1{font-size:32px}
 nav{left:0;right:auto;top:0;bottom:0;width:224px;border:0;border-right:1px solid var(--line);padding:40px 20px;background:var(--surface)}
 nav .tabs{display:flex;flex-direction:column;gap:8px;padding:32px 0 0}
 nav button{text-align:left;padding:14px 16px;font-size:14px;min-height:48px}
 .nav-brand{display:block;padding:0 16px;font-size:16px;font-weight:650;letter-spacing:-.03em;line-height:1.4}.nav-brand span{display:block;color:var(--muted);font-size:12px;font-weight:400;letter-spacing:0;margin-top:3px}
 .planbar{max-width:720px}.session-heading{margin-bottom:24px}.session-workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px 36px;align-items:start;grid-auto-rows:min-content}
 .session-main{grid-column:1}.session-main>.card.first{padding:30px}
 .session-queue{grid-column:2;gap:8px}.session-queue>.queue-heading{margin:0}
 .session-workspace:not(:has(>.session-queue))>.session-main{grid-column:1 / -1;max-width:760px}
 .session-workspace>.card:not(.first),.session-workspace>.fold,.session-workspace>.label,.session-workspace>.empty{grid-column:1 / -1}
 .session-workspace>.fold{margin-top:14px}
 .timer,.toast{left:calc(50% + 112px);bottom:28px}
 body[data-view="ladders"] #view,body[data-view="history"] #view{max-width:880px}
 body.in-setup .wrap{margin:0 auto;max-width:640px;padding-top:42px}
 body.in-setup header.top img{display:block}.setup-intro h2{font-size:42px}
}
/* Progress is a training record: factual counts, quiet comparisons, no scores. */
.progress-page{display:flex;flex-direction:column;gap:32px}
.progress-week>.label{margin:0 0 16px}
.progress-stats{display:flex;gap:48px}
.progress-stats>div{display:flex;flex-direction:column;gap:8px}
.progress-stats b{font-size:44px;line-height:1;letter-spacing:-1.5px;font-weight:600;font-variant-numeric:tabular-nums}
.progress-stats span{font-size:13px;color:var(--muted)}
.progress-columns{display:grid;gap:32px}
.progress-section{border-top:1px solid var(--line);padding-top:22px;min-width:0}
.progress-section h2{font-size:20px;margin:0 0 8px}
.progress-caption{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 16px}
.training-ladder{list-style:none;margin:0;padding:0}
.training-day{position:relative;display:flex;gap:20px;align-items:center;min-height:66px;padding:10px 0}
.training-rung{position:relative;width:26px;align-self:stretch;flex:0 0 26px}
.training-rung::before{content:"";position:absolute;left:4px;right:4px;top:-10px;bottom:-10px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.training-rung::after{content:"";position:absolute;left:0;right:0;height:2px;top:50%;background:var(--muted)}
.training-day:first-child .training-rung::before{top:50%}
.training-day:last-child .training-rung::before{bottom:50%}
.training-day:first-child .training-rung::after{background:var(--accent)}
.training-day time{font-size:14px;font-weight:600}
.training-day div>span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.personal-best{padding:16px 0;border-bottom:1px solid var(--line)}
.personal-best:last-child{border-bottom:0;padding-bottom:0}
.personal-best h3{font-size:14px;font-weight:600;line-height:1.4;margin:0 0 8px;overflow-wrap:anywhere}
.record-value{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.6px;margin:0;font-variant-numeric:tabular-nums}
.record-value>span{font-size:13px;letter-spacing:0;font-weight:400;color:var(--muted)}
.record-context{font-size:12px;color:var(--muted);line-height:1.5;margin:6px 0 0}
.records-empty{font-size:14px;line-height:1.7;color:var(--muted);margin:24px 0 0;max-width:34ch}
.progress-exercises .prow{padding:18px 0;gap:20px;align-items:center}
.progress-note.positive{color:var(--good)!important}
.progress-log{border-top:1px solid var(--line);padding-top:8px}
.progress-log>summary{cursor:pointer;font-size:15px;font-weight:600;padding:14px 0;min-height:48px}
.progress-log>summary>span{display:block;font-size:12px;font-weight:400;color:var(--muted);margin:4px 0 0 17px}
.progress-log .erow{min-height:48px;padding:12px 0;line-height:1.5;overflow-wrap:anywhere}
.progress-empty{max-width:400px;padding:42px 0}
.progress-empty h2{font-size:28px;letter-spacing:-.8px;line-height:1.2}
.progress-empty p{line-height:1.7;color:var(--muted);margin:16px 0 28px}
.progress-empty .primary{min-height:52px}
@media(min-width:700px){.progress-columns{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px}}
@media(max-width:420px){.progress-exercises .prow{flex-wrap:wrap;gap:12px}.progress-exercises .prow>.mini-t{flex:1 0 100%}.progress-exercises .spark{width:100%;max-width:220px;height:44px}}

/* A focused introduction with one question on each screen. */
body.in-setup{background:var(--surface)}
body.in-setup .wrap{max-width:600px;padding:24px 24px 28px;margin:0 auto}
body.in-setup header.top,body.in-setup #saveNote{display:none}
.setup.onboard{gap:0;padding:0;min-height:calc(100svh - 52px)}
.onboard-meta{display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--muted);margin-bottom:24px}
.onboard-progress{display:flex;gap:6px;margin-bottom:32px}
.onboard-progress span{height:3px;flex:1;border-radius:3px;background:var(--line)}
.onboard-progress .on{background:var(--accent)}
.onboard-symbol{width:100px;height:100px;color:var(--accent);margin:30px 0 32px}
.onboard-symbol svg{display:block;width:100%;height:100%;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.onboard-heading h2{font-size:clamp(30px,7.6vw,42px);line-height:1.12;letter-spacing:-1.4px;margin:0 0 16px;max-width:17ch}
.onboard-heading h2:focus{outline:none}
.onboard-heading p{font-size:15px;color:var(--muted);line-height:1.6;margin:0 0 28px;max-width:40ch}
.onboard-preview{display:flex;flex-direction:column;gap:0;counter-reset:setup;max-width:340px;margin-bottom:32px}
.onboard-preview span{display:flex;align-items:center;gap:14px;padding:13px 0;font-size:14px;border-bottom:1px solid var(--line)}
.onboard-preview span::before{counter-increment:setup;content:counter(setup);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.onboard-options{display:flex;flex-direction:column;gap:10px}
.onboard-choice{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);min-height:70px}
.onboard-choice>span:first-child{min-width:0}
.onboard-choice b{display:block;font-size:15px;font-weight:600;line-height:1.4}
.onboard-choice small{display:block;font-size:12px;font-weight:400;color:var(--muted);line-height:1.5;margin-top:3px}
.onboard-choice[aria-pressed="true"]{border-color:var(--accent)}
.onboard-select{width:22px;height:22px;flex:0 0 22px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.onboard-select svg{width:18px;height:18px;fill:none;stroke:var(--accent-ink);stroke-width:2;opacity:0}
.onboard-choice[aria-pressed="true"] .onboard-select{background:var(--accent);border-color:var(--accent)}
.onboard-choice[aria-pressed="true"] .onboard-select svg{opacity:1}
.onboard-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 16px;margin-top:auto;padding-top:24px}
.onboard-actions .primary{grid-column:1 / -1;grid-row:1;min-height:54px;border-radius:14px;font-size:16px;width:100%}
.onboard-back,.onboard-skip{grid-row:2;background:none;color:var(--muted);border:0;min-height:44px;min-width:44px;font-size:13px;padding:8px 4px;font-weight:500}
.onboard-back{grid-column:1;text-align:left;justify-self:start}
.onboard-skip{grid-column:2;text-align:right;justify-self:end}
.onboard[data-step="0"] .onboard-skip{grid-column:1 / -1;justify-self:center;text-align:center}
.onboard-footnote{font-size:12px;line-height:1.5;color:var(--muted);margin:12px 0 0}
.onboard>p.onboard-footnote:last-child{text-align:center}
.onboard-review{margin:0 0 16px}
.onboard-review>div{position:relative;border-top:1px solid var(--line);padding:18px 52px 18px 0}
.onboard-review dt{font-size:12px;color:var(--muted);margin-bottom:6px}
.onboard-review dd{font-size:15px;line-height:1.5;margin:0}
.onboard-review button{position:absolute;top:18px;right:0;background:none;border:0;color:var(--accent);font-size:13px;min-height:44px;padding:0 4px}
.onboard-error{font-size:13px;line-height:1.5;color:var(--bad);margin:12px 0 0}
.onboard-error:empty{display:none}
@media(min-width:700px){body.in-setup .wrap{padding-top:40px}.setup.onboard{min-height:min(820px,calc(100svh - 80px))}.onboard-symbol{margin-top:54px}.onboard-heading{margin-top:12px}}
@media(prefers-reduced-motion:no-preference){
 .onboard-enter .onboard-heading,.onboard-enter .onboard-options,.onboard-enter .onboard-review{animation:onboard-next .32s cubic-bezier(.22,1,.36,1) both}
 .onboard-enter .onboard-options,.onboard-enter .onboard-review{animation-delay:.06s}
 .onboard-enter.onboard-reverse .onboard-heading,.onboard-enter.onboard-reverse .onboard-options,.onboard-enter.onboard-reverse .onboard-review{animation-name:onboard-back}
 .onboard[data-step="0"] .onboard-rung{animation:onboard-rung .45s cubic-bezier(.22,1,.36,1) both;transform-origin:30px center}
 .onboard .rung-two{animation-delay:.09s}.onboard .rung-three{animation-delay:.18s}
 .onboard-choice{transition:border-color .15s,transform .1s cubic-bezier(.4,0,.2,1)}
 .onboard-choice:active{transform:scale(.99)}
 @keyframes onboard-next{from{opacity:.45;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
 @keyframes onboard-back{from{opacity:.45;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
 @keyframes onboard-rung{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:scaleX(1)}}
}

/* Focus: one decision at a time. The full editor stays behind a disclosure. */
body[data-view="today"]{background:var(--surface)}
body[data-view="today"] .top{margin-bottom:0}
body[data-view="today"] .top>img,body[data-view="today"] #today{display:none}
body[data-view="today"] #saveNote{font-size:11px;margin-top:20px}
.focus-shell{max-width:520px;margin:auto}
.focus-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}
.focus-meta summary{color:var(--accent);cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:flex-end}
.focus-meta>span{flex:1}.focus-edit .planbar{padding:12px 0;margin:0;flex-direction:column;align-items:stretch}
.focus-edit[open]{position:relative}.focus-edit[open] .planbar{position:absolute;right:0;top:44px;width:min(340px,calc(100vw - 40px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px #0002;padding:20px;z-index:8}
.focus-stage{position:relative;min-height:min(590px,calc(100svh - 245px));display:flex;flex-direction:column;text-align:center;padding-top:42px}

.step-guide-button{margin-top:var(--scale-space-2);color:var(--color-action)}
@media(max-width:599px){.pending-workout{align-items:stretch;flex-direction:column}.pending-workout button{width:100%}.pending-workout h2{font-size:22px}}
@media(min-width:700px) and (min-height:700px){

/* Shared interaction rhythm: readable labels, stable targets and contained sheets. */
body[data-view] button[data-control]{max-width:100%;word-break:normal}

.workout-tools-head>:not(button),.preferences-head>:not(button){min-width:0;overflow-wrap:break-word}
.workout-tools-head>button,.preferences-head>button{flex-shrink:0;align-self:flex-start}
.workout-tools-body{scroll-padding-block:var(--space-inset);scrollbar-width:thin;padding-bottom:max(var(--space-section),env(safe-area-inset-bottom,0px))}
.workout-tools-body .tool-action>span:first-child{min-width:0;overflow-wrap:break-word;line-height:1.5}
.workout-tools-body .tool-action>span[aria-hidden="true"]{flex:none;min-width:24px;text-align:center}
.workout-tools-body .tool-action:focus-visible{outline-offset:-3px;border-radius:var(--button-radius)}
.workout-tools-body .tool-action:not(:disabled,[aria-disabled="true"]):active{background:var(--color-selected)}
.workout-tools-body .tool-section:last-child{border-bottom:0}
.library-filters{padding:6px;gap:var(--scale-space-2);scroll-padding-inline:6px;overscroll-behavior-inline:contain}
.library-filters button{scroll-margin-inline:6px}
.ctl .lui-choice{min-width:0;gap:var(--scale-space-2)}
.ctl .lui-choice>.lui-button{padding-inline:var(--scale-space-2)}
.ctl-visibility{flex-wrap:wrap}.ctl-visibility small{flex:1;min-width:12ch}
.app-support .support-consent{min-height:var(--target-min);cursor:pointer}
@media(hover:hover){
 .workout-tools-body .tool-action:not(:disabled,[aria-disabled="true"]):hover{background:var(--color-selected)}
 body[data-view] button[data-control]:not(:disabled,[aria-disabled="true"]):hover{border-color:var(--color-action)}
}
@media(max-width:699px){
 body .workout-tools{max-height:90dvh;border-bottom-left-radius:0;border-bottom-right-radius:0}
 .workout-tools-head{padding-left:max(var(--space-inset),env(safe-area-inset-left,0px));padding-right:max(var(--space-inset),env(safe-area-inset-right,0px))}
 body .workout-tools .workout-tools-body{padding-left:max(var(--space-inset),env(safe-area-inset-left,0px));padding-right:max(var(--space-inset),env(safe-area-inset-right,0px))}
}

/* Settings and routine editing share the app's control rhythm. */
.app-settings .settings-section{border-top:1px solid var(--color-stroke);padding-block:var(--space-inset)}
.app-settings .settings-section h3{font-size:var(--type-meta);color:var(--color-ink-secondary);margin:0 0 var(--space-control)}
.app-settings .settings-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-inset);width:100%;text-align:left;white-space:normal}
.settings-row-copy{min-width:0}.settings-row-title,.settings-row-detail{display:block}
.settings-row-detail{margin-top:var(--scale-space-1);font-size:var(--type-meta);font-weight:400;color:var(--color-ink-secondary);line-height:1.5}
.app-settings [data-display-done]{width:100%;margin-top:var(--space-control)}
.routine-editor-header h2{margin-bottom:var(--scale-space-2)}
.routine-selection-summary{color:var(--color-ink-secondary);font-size:var(--type-control);line-height:1.5;margin:var(--space-control) 0 var(--space-inset)}
#routineEditor fieldset{border:0;padding:0;min-width:0;margin:var(--space-inset) 0}
#routineEditor legend{padding:0;margin-bottom:var(--space-control)}
.routine-pick-copy{min-width:0;overflow-wrap:break-word}.routine-pick-copy small{display:block;color:var(--color-ink-secondary);font-size:var(--type-meta);line-height:1.5;margin-top:var(--scale-space-1)}
#routineEditor .pick{min-height:72px;align-items:center;gap:var(--space-control)}
#routineEditor .pick input{flex:none;width:20px;height:20px;accent-color:var(--color-action)}
#routineEditor .pick:has(input:checked){border-color:var(--color-action);background:var(--color-selected)}
#routineEditor .pick:focus-within{outline:var(--focus-width) solid var(--color-action);outline-offset:var(--focus-offset)}
.routine-validation{color:var(--color-critical);font-size:var(--type-control)}
.lui-toast{box-sizing:border-box}.lui-toast>span{min-width:0;overflow-wrap:break-word;line-height:1.5}.lui-toast .lui-button{flex:none}
@media(max-width:399px){.lui-toast{flex-wrap:wrap}.lui-toast>span{flex-basis:100%}}

.routine-discard{padding:var(--space-inset);border:1px solid var(--color-stroke);background:var(--color-selected);border-radius:var(--button-radius);margin-bottom:var(--space-inset)}
.routine-discard p{margin:0 0 var(--space-control)}.routine-discard>div{display:flex;flex-wrap:wrap;gap:var(--space-control)}
.routine-validation:empty{display:none}

.routine-selection-summary>b,.routine-selection-summary>span{display:block}.routine-selection-summary>span{margin-top:var(--scale-space-1)}
.routine-discard button{margin:var(--scale-space-1)}

/* Portrait tablets use a vertical workout composition instead of a shallow desktop row. */

 body[data-view="today"] .focus-shell>.focus-stage:has(.focus-counter){grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto auto auto auto;row-gap:var(--space-section);max-width:680px;margin-inline:auto;padding-block:var(--space-section)}
 body[data-view="today"] .focus-stage:has(.focus-counter)>.focus-exercise{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center;gap:var(--space-section)}

 body[data-view="today"] .focus-stage:has(.focus-counter) .focus-dial{width:clamp(200px,28vw,240px)}
 body[data-view="today"] .focus-stage:has(.focus-counter)>.focus-set-path{grid-column:1/-1;grid-row:3}
 body[data-view="today"] .focus-stage:has(.focus-counter)>.focus-actions{grid-column:1/-1;grid-row:4;width:min(480px,100%);justify-self:center}
}
.custom-draft-note{color:var(--color-ink-secondary);font-size:var(--type-meta);line-height:1.5}
.custom-draft-actions{display:flex;align-items:center;gap:var(--space-control);justify-content:flex-end;margin-top:var(--space-control)}

/* Short phones retain a complete primary action above the fixed tab bar. */
@media(max-width:699px) and (max-height:699px){
 body[data-view="today"] .plan-summary{margin:var(--scale-space-1) 0 var(--scale-space-2)}
 body[data-view="today"] .focus-shell>.focus-stage:has(.focus-counter){padding-top:var(--scale-space-1)}
 body[data-view="today"] .focus-stage:has(.focus-counter) .focus-exercise{gap:var(--space-control)}
 body[data-view="today"] .focus-stage:has(.focus-counter) .focus-exercise-art .exercise-thumb{width:88px;height:64px;flex-basis:88px}
 body[data-view="today"] .focus-stage:has(.focus-counter) .focus-exercise h2{font-size:var(--scale-type-title)}

 body[data-view="today"] .focus-counter{margin:var(--space-control) 0 var(--scale-space-2)}
 body[data-view="today"] .focus-dial{width:clamp(96px,16svh,112px);min-height:0;height:auto;aspect-ratio:1}
 body[data-view="today"] .focus-number{font-size:clamp(44px,8svh,56px)}
 body[data-view="today"] .focus-unit{font-size:var(--type-meta);line-height:1.3}
 body[data-view="today"] .focus-set-path{margin-top:var(--scale-space-2)}
 body[data-view="today"] .focus-actions{padding-top:var(--scale-space-1);margin-bottom:var(--scale-space-2)}
}

@media(max-width:699px) and (max-height:599px){
 body[data-view="today"] .plan-summary button{padding-block:var(--scale-space-2)}
 body[data-view="today"] .focus-exercise .focus-howto{min-height:var(--target-min);padding-block:0}
 body[data-view="today"] .focus-counter{margin-block:var(--scale-space-2)}
 body[data-view="today"] .focus-set-path{margin-block:var(--scale-space-1)}
}
.cloud-history-notice{padding:var(--space-inset);margin:var(--space-control) 0;border:1px solid var(--color-stroke);border-radius:var(--panel-radius);background:var(--color-selected)}
.cloud-history-notice p{margin:0 0 var(--scale-space-2);font-size:var(--type-control);line-height:1.5}
.cloud-history-notice button{min-height:var(--target-min)}

body.end-workout-open{overflow:hidden}
.end-workout-actions{display:grid;gap:var(--space-control);margin-top:var(--space-section)}
.end-workout-actions button{width:100%;white-space:normal}

@media(max-width:699px) and (max-height:599px){
 body[data-view="today"] .focus-counter{margin-block:var(--scale-space-1)}
 body[data-view="today"] .focus-shell .focus-stage:has(.focus-counter) .focus-target{margin-block:0}
}

/* Native workout selector shares modal sizing and backdrop behavior. */
dialog.sheet{box-sizing:border-box;top:auto;bottom:0;width:min(560px,100%);max-width:100%;margin:0 auto;border:1px solid var(--color-stroke);color:var(--color-ink);max-height:85dvh;overscroll-behavior:contain}
dialog.sheet::backdrop{background:rgba(5,17,23,.55);backdrop-filter:blur(3px)}
body:has(#workoutFilterSheet[open]){overflow:hidden}

/* Long timer results need an explicit duration review before recording. */
body.hold-review-open{overflow:hidden}
.hold-review .hold-review-number{display:block;box-sizing:border-box;width:100%;min-height:var(--target-min);margin-block:var(--space-control);font-size:var(--type-title);font-variant-numeric:tabular-nums}
.hold-review-actions{display:grid;gap:var(--space-control);margin-top:var(--space-section)}
.hold-review-actions button{width:100%;white-space:normal}

/* One global entry point; workout controls stay beside their own summary. */
body[data-view] header.top .appearance-toggle{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:auto;height:auto;min-width:0;min-height:var(--target-min);padding:8px 12px;margin-left:auto;flex:none;border:1px solid var(--color-stroke);background:var(--color-surface);color:var(--color-ink-secondary);border-radius:var(--button-radius);font-size:var(--type-control);line-height:1.4}
header.top .appearance-toggle>svg{width:18px;height:18px;flex:none}
header.top .appearance-toggle .dot{display:none}
header.top .appearance-toggle[data-attention="true"] .dot{display:block;position:absolute;inset:3px 3px auto auto;width:7px;height:7px;min-width:0;min-height:0;box-shadow:0 0 0 2px var(--color-surface);background:var(--color-critical);border-radius:50%}
header.top .appearance-toggle .dot::after{content:none}

body[data-view="today"] .focus-meta>span{flex:0 1 auto}
body[data-view] .workout-tools-button{display:inline-flex;gap:8px;white-space:nowrap;flex:none;margin:0}

.settings-save-status{font-size:var(--type-control);line-height:1.5;color:var(--color-ink-secondary);margin:0 0 var(--space-control);overflow-wrap:break-word}
.settings-save-status.needs-attention{color:var(--color-critical)}

 body[data-view="today"] .focus-stage[data-phase="rest"] .focus-ring{width:112px;height:112px}

}

/* Timed holds keep the movement visible rather than becoming an anonymous clock. */
.hold-context{display:grid;grid-template-columns:128px minmax(0,1fr);align-items:center;gap:var(--space-inset);width:min(100%,520px);text-align:left}
.hold-context>div{min-width:0}.hold-context h2{font-size:clamp(24px,4vw,32px);line-height:1.15;overflow-wrap:break-word}
.hold-context .exercise-thumb{width:128px;height:96px;object-fit:cover;flex:none;margin:0}
.hold-context .focus-eyebrow{margin:0 0 4px}.hold-context .focus-howto{min-height:var(--target-min);padding:4px 0}
.hold-form-cue{font-size:var(--type-control);line-height:1.5;color:var(--color-ink-secondary);text-align:center;max-width:440px;margin:0}
body[data-view="today"] .focus-stage[data-running-hold="true"] .hold-running{gap:var(--space-control);width:100%}
@media(max-width:699px) and (max-height:699px){
 body[data-view="today"] .focus-stage[data-running-hold="true"]{padding-top:4px;min-height:0}
 .hold-context{grid-template-columns:88px minmax(0,1fr);gap:12px}
 .hold-context .exercise-thumb{width:88px;height:72px}
 .hold-context h2{font-size:24px}
 body[data-view="today"] .focus-stage[data-running-hold="true"] .hold-running{gap:8px}
 body[data-view="today"] .focus-stage[data-running-hold="true"] .focus-clock{font-size:56px;letter-spacing:-2px}
 .hold-form-cue{font-size:12px}
}
.hold-guide-notice{padding:var(--space-control);margin-bottom:var(--space-inset);background:var(--color-selected);border-radius:var(--button-radius)}
/* During a hold, planning stays out of the movement's way. */
body[data-view="today"]:has(.hold-running) .plan-summary{display:none}

body.hold-preparation-open{overflow:hidden}
.hold-preparation .exercise-thumb{display:block;width:100%;height:clamp(120px,22svh,220px);object-fit:contain;margin:0 0 var(--space-control);background:var(--art-bg)}
.hold-preparation .workout-tools-body>p{font-size:var(--type-control);line-height:1.5;margin:12px 0}
.hold-preparation-goal{font-weight:650;color:var(--color-action)}
.hold-preparation-actions{display:grid;gap:8px;margin-top:var(--space-inset)}
.hold-preparation-actions button{width:100%;white-space:normal}

:root{--brand-display:"Ladder Display",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}

/* Ladder identity: steady climb. Color adds warmth; controls retain their meanings. */
:root{--brand-peach:#ffc8b4;--brand-peach-ink:#773e2a;--brand-caption-ink:#512b1f;--color-field-stroke:#77898a;--brand-ease:cubic-bezier(.22,1,.36,1);--body:system-ui,-apple-system,'Segoe UI',sans-serif;--button-radius:16px}
.brand-name{display:inline-flex;flex-direction:column;text-align:left;font-family:var(--display);line-height:1.04;letter-spacing:-.025em;white-space:nowrap;color:var(--ink)}
.brand-name small{font-family:var(--body);font-size:12px;letter-spacing:0;font-weight:550;margin-bottom:3px}
.brand-name b{font-size:22px;font-weight:800}
.onboard-meta>span:first-child{gap:10px;align-items:center}
.onboard-meta .brand-symbol{width:36px;height:36px;flex-basis:36px}
.onboard-meta .brand-name small{font-size:12px}.onboard-meta .brand-name b{font-size:22px}
.nav-brand .brand-name{display:flex;color:var(--ink);line-height:1.04;letter-spacing:-.025em;margin-top:0}
.nav-brand .brand-name small{font-size:12px}.nav-brand .brand-name b{font-size:34px}
.nav-brand .brand-tagline{display:block;margin-top:14px;font:12px/1.5 var(--body);letter-spacing:0;color:var(--muted);max-width:13ch}
.onboard-heading .brand-kicker{display:flex;align-items:center;gap:8px;color:var(--brand-peach-ink);font:600 12px/16px var(--body);letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px}

  if(a==='reviewadvanced'){workoutToolsPanel='advanced';workoutToolsOpen=true;render();const editor=$('#workoutTools .focus-advanced');if(editor)editor.open=true;$('#workoutTools .session-main .step-name')?.focus({preventScroll:true});return;}
  if(a==='undo'){undoFocus();return;}
  if(a==='skip'){resumeFocus();return;}
  if(a==='subtract'){adjustRest(-30);return;}
  if(a==='add'){addFocusRest();return;}
  if(a==='choose'){if(focusRun?.phase==='paused'){toast('Resume your paused workout first.');return;}if(hold){toast('Finish or cancel the running hold first.');return;}const changed=focusRun.at!==+b.dataset.i;stopTimer();focusRun.at=+b.dataset.i;focusRun.phase='work';if(changed){primeAudio();workoutCue('exercise');}persistFocus();render();return;}
  if(!t)return;
  if(a==='plus'||a==='minus'){const previous=focusValue();x.value=Math.min(9999,Math.max(0,previous+(a==='plus'?1:-1)*stepInc(sessionSpec(t))));persistFocus();rollFocusNumber(previous,x.value);return;}
  if(a==='complete'){completeFocus();return;}
  if(a==='hold'){if(hold)return;if(!x.values.length)openHoldPreparation(t);else beginFocusHold(t);return;}
  if(a==='finish'){finishHold();return;}
  if(a==='cancel'){stopTimer();announceTimer('Hold cancelled. No set recorded.');render();$('#focusPrimary')?.focus({preventScroll:true});}
}

function rungs(t,lvl){ return `<div class="rung" aria-label="Step ${lvl+1} of ${t.steps.length}">${t.steps.map((_,i)=>`<i class="${i<=lvl?"on":""}"></i>`).join("")}</div>`; }

function fullCard(t, first){
  const lvl=sessionLevel(t), st=sessionSpec(t), timed=isSec(st[4]);
  const last=lastFor(t.id);
  const advice=progression(t,lvl,st);
  const canUp = !focusRun?.items.find(x=>x.id===t.id&&x.swap)&&!lightSessionItem(t,lvl)&&advice.kind==='up';
  const tooHard = !focusRun?.items.find(x=>x.id===t.id&&x.swap)&&advice.kind==='down';
  const lastStep = last ? stepByKey(last.k) : null;
  const g=sessionGoals(t,lvl,st), d=drafts[t.id] || g.map(String), rest=restOf(t,st);
  const hn = holdNext[t.id] ?? 0;
  const cols = st[1]===4 ? 2 : Math.min(st[1],3);
  const checked=completedSets[t.id]||new Set();
  const activeSet=Array.from({length:st[1]},(_,i)=>i).find(i=>!checked.has(i));
  return `<section class="card${first?" first":""}" id="card-${t.id}">
    <div class="track-head"><div><div class="label">${first?`<span class="next">Current</span> · `:""}${esc(t.name)}${t.steps.length<2?"":` · step ${lvl+1}/${t.steps.length}`}</div>${t.steps.length<2?"":rungs(t,lvl)}</div>
      <span class="target">${lightSessionItem(t,lvl)?'Lighter targets today':targetText(st)}</span>${first?"":`<button class="icon" data-act="close" data-t="${t.id}" aria-label="Close ${esc(t.name)}">✕</button>`}</div>
    <div class="move workout-title"><div class="move-text"><h2 class="step-name" tabindex="-1">${esc(st[0])}</h2><p class="cue">${esc(st[5])}${st[6]!=="None"?` <span class="gear">Needs: ${esc(st[6])}</span>`:""}</p></div></div>
    <p class="set-progress" role="status">${checked.size} of ${st[1]} sets marked done${activeSet===undefined?" · Ready to save":""}</p>
    ${timed && hn<st[1] ? `<button class="holdbtn" data-act="hold" data-t="${t.id}">▶ Start hold · set ${hn+1} of ${st[1]} · goal ${g[hn]}s</button>` : ""}
    <div class="sets" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${d.map((v,i)=>`<div class="set${timed&&i<hn?" timed":""}${checked.has(i)?" set-done":i===activeSet?" set-active":""}">
      <label for="in-${t.id}-${i}">Set ${i+1} <span>goal ${g[i]}${unit(st[4])}</span></label>
      <input id="in-${t.id}-${i}" inputmode="numeric" pattern="[0-9]*" value="${esc(v)}" data-t="${t.id}" data-i="${i}" data-g="${g[i]}" class="${parseInt(v,10)>=g[i]?"hit":""}">
      <div class="pm"><button data-act="dec" data-t="${t.id}" data-i="${i}" aria-label="Less, set ${i+1}">−</button><button data-act="inc" data-t="${t.id}" data-i="${i}" aria-label="More, set ${i+1}">+</button></div><button class="set-check" data-act="complete" data-t="${t.id}" data-i="${i}" aria-pressed="${checked.has(i)}" aria-label="${checked.has(i)?"Unmark":"Mark"} set ${i+1} done">${checked.has(i)?"✓ Done":"Mark done"}</button></div>`).join("")}</div>
    <div class="row workout-actions"><button class="ghost" data-act="rest" data-t="${t.id}">Rest ${restLabel(rest)}</button><button class="primary" data-act="save" data-t="${t.id}">Save exercise</button></div>
    <p class="save-hint">Save exercise records only entered or marked sets. Untouched targets are not recorded.</p>
    <details class="technique"><summary>View technique</summary>${techniqueContent(t,lvl,st)}</details>
    ${canUp?`<div class="levelup big">${exerciseThumbnail(t,lvl+1)}<div><span>You topped out. Next: ${esc(t.steps[lvl+1][0])}</span><button data-act="up" data-t="${t.id}">Level up</button></div></div>`:""}
    ${tooHard?`<div class="stepdown"><span>Under the range last time. That's fine, or try an easier step.</span><button data-act="down" data-t="${t.id}">Easier: ${esc(t.steps[lvl-1][0])}</button></div>`:""}
    ${!canUp ? (last ? `<div class="last">Last time, ${ago(last.ts)}: ${last.sets.join(" · ")}${lastStep?unit(lastStep.st[4]):""}${lastStep&&!t.custom&&lastStep.i!==lvl?` (${esc(lastStep.st[0])})`:""}</div>` : `<div class="last">New for you. Start at the low end and focus on form.</div>`) : ""}
  </section>`;
}

function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function spark(entries){
  // total reps or seconds per session, oldest → newest; a new colour where the step changed
  const vals=entries.map(e=>e.sets.reduce((a,b)=>a+b,0)); const W=120,H=32,max=Math.max(...vals,1),min=Math.min(...vals,0);
  const x=i=>vals.length<2?W/2:4+i*(W-8)/(vals.length-1), y=v=>H-4-(H-8)*((v-min)/((max-min)||1));
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const marks=entries.map((e,i)=>i>0&&e.k!==entries[i-1].k?`<line x1="${x(i)}" x2="${x(i)}" y1="2" y2="${H-2}" stroke="var(--good)" stroke-dasharray="2 2"/>`:"").join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${marks}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="3" fill="var(--accent)"/></svg>`;
}
// Compare totals only within the same step and recorded set count.
function personalBests(log=state.log){
  const groups=new Map();
  for(const e of [...log].sort((a,b)=>a.ts-b.ts)){
    if(!stepByKey(e.k))continue;
    const key=e.k+'|'+e.sets.length;
    if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e);
  }
  const records=[];
  for(const entries of groups.values()){
    const total=e=>e.sets.reduce((a,b)=>a+b,0);
    let best=entries[0];
    for(const e of entries.slice(1))if(total(e)>total(best))best=e;
    if(best!==entries[0])records.push({entry:best,total:total(best),gain:total(best)-total(entries[0]),count:best.sets.length});
  }
  return records.sort((a,b)=>b.entry.ts-a.entry.ts);
}
function trainingDays(log=state.log){
  const days=new Map();
  for(const e of log){const key=dayOf(e.ts);if(!days.has(key))days.set(key,[]);days.get(key).push(e);}
  return [...days].sort((a,b)=>b[0].localeCompare(a[0])).map(([date,entries])=>({date,entries,exercises:new Set(entries.map(e=>e.t)).size,sets:entries.reduce((n,e)=>n+e.sets.length,0)}));
}

function applySearch(){
  document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===exCategory)));
  const q=exQuery.trim().toLowerCase(),matches=text=>q.split(/\s+/).every(w=>text.toLowerCase().includes(w));let count=0;const groupsShown=new Set();
  document.querySelectorAll("#view [data-sr]").forEach(el=>{ const hit=(exCategory==='All'||el.dataset.g===exCategory)&&(!q||matches(el.dataset.sr)); el.hidden=!hit; if(hit){ count++; groupsShown.add(el.dataset.g); } });
  document.querySelectorAll("#view [data-grp]").forEach(el=>{ el.hidden = !groupsShown.has(el.dataset.grp); });
  document.querySelectorAll('[data-search-track]').forEach(el=>{const t=findTrack(el.dataset.searchTrack),names=q?t.steps.map(s=>s[0]).filter(matches):[];el.hidden=!names.length;el.textContent=names.length?'Matches: '+names.slice(0,2).join(' · ')+(names.length>2?' · +'+(names.length-2)+' more':''):'';});
  document.querySelectorAll('[data-step-name]').forEach(el=>el.classList.toggle('search-match',!!q&&matches(el.dataset.stepName)));
  if(q)document.querySelectorAll('.exopen .library-progression').forEach(el=>{if([...el.querySelectorAll('[data-step-name]')].some(step=>matches(step.dataset.stepName)))el.open=true;});
  const none=$("#exNone"); if(none) none.hidden = !!count;
  const status=$('#exSearchStatus');if(status){status.hidden=!q&&exCategory==='All';status.textContent=(q||exCategory!=='All')?(count?count+' '+(count===1?'ladder':'ladders')+' found':'No matching exercise ladders in this category'):'';}
}
$("#view").addEventListener("input",e=>{
  captureCustomExerciseField(e.target);
  if(e.target.id==='rName'&&editing){editing.name=e.target.value;editing.error='';e.target.removeAttribute('aria-invalid');const message=$('#routineValidation');if(message)message.textContent='';return;}
  if(e.target.id==="exSearch"){ exQuery=e.target.value; applySearch(); return; }
  if(e.target.closest('#addForm')&&document.querySelector('#addForm [aria-invalid="true"]'))validateCustomExercise();
  if(e.target.matches('[data-set-count]')){if(e.target.hasAttribute('aria-invalid'))LadderControls.fieldError(e.target,'');return;}
  if(e.target.id==="cName"){ const c=$("#cCount"); if(c) c.textContent=e.target.value.length+"/40"; return; }
  const i=e.target.closest("input[data-t]"); if(!i) return;
  const t=findTrack(i.dataset.t), lvl=sessionLevel(t), st=spec(t,lvl);
  if(hold?.tid===t.id){i.value=drafts[t.id]?.[+i.dataset.i]??String(sessionGoals(t,lvl,st)[+i.dataset.i]);toast('Finish or cancel the hold before editing its sets.');return;}
  drafts[t.id]=drafts[t.id]||sessionGoals(t,lvl,st).map(String);
  drafts[t.id][+i.dataset.i]=i.value.replace(/\D/g,"").slice(0,4);
  captureAdvancedDraft(t,+i.dataset.i);
  i.classList.toggle("hit", parseInt(i.value,10)>=+i.dataset.g);
});
function validateCustomExercise(){
  const messages=new Map(),name=$('#cName'),min=$('#cMin'),max=$('#cMax'),sets=$('#cSets');
  if(!name.value.trim())messages.set(name,'Enter a name for your exercise.');
  else if(name.value.trim().length>40)messages.set(name,'Use 40 characters or fewer.');
  for(const input of [min,max,sets]){const n=Number(input.value);if(!input.value.trim()||!Number.isInteger(n)||n<1||n>Number(input.max))messages.set(input,input===sets?'Choose a whole number from 1 to 6.':'Choose a whole number from 1 to 9,999.');}
  if(!messages.has(min)&&!messages.has(max)&&Number(max.value)<Number(min.value))messages.set(max,'Choose a goal at least as high as your starting target.');
  for(const input of [name,min,max,sets])LadderControls.fieldError(input,messages.get(input)||'');
  return !messages.size;
}
function updateTrackSets(t,n,{refresh=true}={}){
  if(n===spec(t)[1])return;
  if(hold&&hold.tid===t.id)stopTimer();
  state.prefs.sets[t.id]=n;delete drafts[t.id];delete holdNext[t.id];delete completedSets[t.id];commit();if(refresh)render();
}
$("#view").addEventListener("submit",e=>{
  if(e.target.id!=="addForm") return; e.preventDefault();
  if(!validateCustomExercise()){document.querySelector('#addForm [aria-invalid="true"]')?.focus();return;}
  const name=$("#cName").value.trim(),type=$("#cType").value;
  const min=+$("#cMin").value,max=+$("#cMax").value,sets=+$("#cSets").value;
  const id="c"+Date.now().toString(36);
  state.custom.push({id,name,sets,min,max,unit:type==="sec"?"sec":"reps"});
  customExerciseDraft=customExerciseDefaults();
  libraryPanel=null;commit(); render(); toast(`${name} added. Find it on Today.`);document.querySelector('[data-panel="custom"]')?.focus({preventScroll:true});
});

function saveSetCountInput(input){
  const n=Number(input.value);
  if(!input.value||!Number.isInteger(n)||n<1||n>6){LadderControls.fieldError(input,'Choose 1–6 sets.');return;}
  const t=findTrack(input.dataset.setCount);if(!t)return;
  // Keep the field in place so typing, blur and keyboard traversal stay native.
  updateTrackSets(t,n,{refresh:false});LadderControls.fieldError(input,'');
  const ctl=input.closest('.ctl');
  ctl.querySelector('[data-act="setsDec"]').disabled=n<=1;
  ctl.querySelector('[data-act="setsInc"]').disabled=n>=6;
  document.querySelectorAll(`[data-track-prescription="${t.id}"]`).forEach(el=>el.textContent=targetText(spec(t)));
  const summary=document.querySelector(`[data-panel="settings-${t.id}"] span`);
  if(summary)summary.textContent=`${n} sets · ${focusOf(t.id)==='normal'?'Balanced priority':focusOf(t.id)==='more'?'Higher priority':'Lower priority'}`;
}

  const status=focusRun.phase==='finished'?(focusRun.closedEarly||focusRun.endStatus==='partial'||!fullyDone?'partial':'completed'):focusRun.phase==='paused'?'paused':'active';
  if(focusRun.phase==='finished')focusRun.endStatus=status;

  if(summary){
   if(focusRun.ended&&summary.ended)summary.ended=focusRun.ended;
   const old=(state.sessions||[]).find(s=>s.id===summary.id),semantic=s=>{if(!s)return '';const {updated,...rest}=s;return JSON.stringify(rest);};

function validSessionPause(p,x=focusItem()){
 if(!p||typeof p!=='object'||!['work','rest','hold'].includes(p.kind))return false;
 const bounded=(n,max)=>Number.isFinite(n)&&n>=0&&n<=max;
 if(p.kind==='work')return true;
 if(p.kind==='rest')return bounded(p.remainingMs,3600000)&&bounded(p.duration,3600);
 return !!x&&p.tid===x.id&&p.key===x.key&&Number.isInteger(p.i)&&p.i>=0&&p.i<x.goals.length&&bounded(p.elapsedMs,86400000)&&bounded(p.readyMs,10000)&&bounded(p.goal,9999)&&[1,2].includes(p.sides)&&Number.isInteger(p.side)&&p.side>=1&&p.side<=p.sides&&(p.first===undefined||bounded(p.first,9999));
}
function pauseWorkout({quiet=false}={}){
 if(!focusRun||focusRun.phase==='finished'||focusRun.phase==='paused')return false;
 if(hold&&hold.tid!==focusItem()?.id){toast('Finish or cancel the running hold before changing this workout. Its timer is still running.');return false;}
 const now=Date.now();let p={kind:'work'};
 if(hold){const h=hold,x=focusItem();p={kind:'hold',tid:h.tid,key:x?.key,i:h.i,goal:h.goal,elapsedMs:Math.max(0,now-h.start),readyMs:Math.max(0,h.start-now),side:h.side,sides:h.sides,focus:!!h.focus,announcedStart:!!h.announcedStart,targetReached:!!buzzed,...(h.first===undefined?{}:{first:h.first})};}
 else if(focusRun.phase==='rest')p={kind:'rest',remainingMs:Math.max(0,Math.min(3600000,focusRun.restEnd-now)),duration:Math.min(3600,focusRun.restDuration||0)};
 focusRun.pauseSnapshot=validSessionPause(p)?p:{kind:'work'};stopTimer();focusRun.phase='paused';focusRun.pausedAt=now;focusUndo=null;persistFocus();

 return true;
}
function resumeWorkout(){
 if(!focusRun||focusRun.phase!=='paused')return;

 delete focusRun.pauseSnapshot;delete focusRun.pausedAt;focusRun.phase='work';focusRun.resumeDay=dayOf(Date.now());focusUndo=null;
 if(p.kind==='rest'&&p.remainingMs>0){focusRun.phase='rest';focusRun.restDuration=p.duration||p.remainingMs/1000;focusRun.restEnd=Date.now()+p.remainingMs;startRest(p.remainingMs/1000,focusRun.restEnd);}
 if(p.kind==='hold'){
  const t=findTrack(p.tid);if(t){holdNext[t.id]=p.i;startHold(t,p.side);Object.assign(hold,{goal:p.goal,start:Date.now()+p.readyMs-p.elapsedMs,focus:p.focus,announcedStart:p.announcedStart===true,side:p.side,sides:p.sides,...(p.first===undefined?{}:{first:p.first})});buzzed=p.targetReached===true;tick();}
 }

function autoPauseOlderWorkout(){
 if(!focusRun||!['work','rest'].includes(focusRun.phase)||!Number.isFinite(focusRun.started))return false;
 const today=dayOf(Date.now());
 if(dayOf(focusRun.started)===today||focusRun.resumeDay===today)return false;
 if(!(focusRun.items||[]).some(x=>x.entry||x.skipped||LadderSessions.performed(x).length||sessionHasDraft(x)))return false;

}
function clearPendingSessionDraft(x){delete drafts[x.id];delete completedSets[x.id];delete holdNext[x.id];delete x.advancedDraft;delete x.value;}
function nextSessionLogTs(tid){
 let next=Math.max(Date.now(),lastSaveAt+1);for(const entry of state.log)if(entry.t===tid&&Number.isFinite(entry.ts))next=Math.max(next,entry.ts+1);return next;
}
function savePendingSessionItem(x){
 if(!sessionPending(x))return null;
 const vals=LadderSessions.performed(x);if(!vals.length)return null;
 if(!focusRun.sessionId)persistFocus();
 const now=nextSessionLogTs(x.id);lastSaveAt=now;
 const entry={ts:now,t:x.id,k:x.key,sets:vals.slice(),partial:true,sessionId:focusRun.sessionId,...(x.mode==='light'?{mode:'light'}:{}),...(x.swap?{insteadOf:x.swap.original.key}:{})};

function advanceWorkoutItem(){
 const next=focusRun.items.findIndex(sessionPending);focusRun.restEnd=0;

}
function finishWorkoutToday({startNew=false}={}){

 if(hold&&hold.tid!==focusItem()?.id){toast('Finish or cancel the running hold before finishing this workout. Its timer is still running.');return;}
 closeWorkoutTools();pauseWorkout({quiet:true});persistFocus();
 const session=focusRun,pending=session.items.filter(sessionPending),pendingSets=pending.reduce((n,x)=>n+LadderSessions.performed(x).length,0),totals=sessionTotals(session),untouched=pending.filter(x=>!LadderSessions.performed(x).length).length;
 const unfinishedHold=session.pauseSnapshot?.kind==='hold'?' The unfinished hold is not a completed set and will not be saved.':'';
 const d=document.createElement('dialog');d.id='finishWorkoutToday';d.className='workout-tools end-workout-sheet';d.setAttribute('aria-labelledby','finishWorkoutTodayTitle');
 d.innerHTML=`<div class="workout-tools-head"><h2 id="finishWorkoutTodayTitle">${startNew?'Save & start today’s plan?':'Finish for today?'}</h2><button type="button" data-session-finish-cancel aria-label="Keep workout paused">×</button></div><div class="workout-tools-body"><div class="finish-save-summary"><p><strong>${totals.sets} ${totals.sets===1?'set':'sets'} already saved</strong></p>${pendingSets?`<p>${pendingSets} performed ${pendingSets===1?'set will':'sets will'} also be saved.</p>`:''}</div><p>${untouched?untouched+' untouched '+(untouched===1?'exercise stays':'exercises stay')+' unrecorded. ':''}Unmarked numbers and targets are not counted.${unfinishedHold}</p><p class="cue">The workout stays paused until you choose.</p><div class="end-workout-actions"><button type="button" class="primary" data-session-finish-confirm>${startNew?'Save & start today’s plan':'Save & finish for today'}</button><button type="button" data-session-finish-cancel>Keep paused</button></div></div>`;
 let accepted=false;
 const close=()=>d.close();d.querySelectorAll('[data-session-finish-cancel]').forEach(b=>b.addEventListener('click',close));
 d.querySelector('[data-session-finish-confirm]').addEventListener('click',()=>{
  if(focusRun!==session){close();return;}accepted=true;
  for(const x of session.items){savePendingSessionItem(x);if(!x.skipped&&(!x.entry||!state.log.some(e=>entryId(e)===x.entry&&e.sets.length>=x.goals.length)))x.omitted=true;}
  const full=session.items.every(x=>!x.skipped&&!x.omitted&&x.entry&&state.log.some(e=>entryId(e)===x.entry&&e.sets.length>=x.goals.length));
  stopTimer();delete session.pauseSnapshot;session.closedEarly=session.closedEarly||!full;session.phase='finished';session.endStatus=full&&!session.closedEarly?'completed':'partial';session.ended=Date.now();focusUndo=null;commit();persistFocus();
  if(startNew){focusRun=null;readinessChoice=null;swapChoice=null;persistFocus();}
  close();render();announceTimer(startNew?'Previous workout saved. Today’s plan is ready.':'Workout finished. Performed sets are saved.');$('#focusPrimary')?.focus({preventScroll:true});
 });
 d.addEventListener('cancel',e=>{e.preventDefault();close();});
 d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();});
 d.addEventListener('close',()=>{d.remove();document.body.classList.remove('end-workout-open');if(!accepted){render();document.querySelector('[data-session-action="resume"]')?.focus({preventScroll:true});}},{once:true});
 document.body.append(d);applyComponentSystem(d);document.body.classList.add('end-workout-open');d.showModal();d.querySelector('[data-session-finish-cancel]').focus({preventScroll:true});
}
function workoutPauseMarkup(){
 if(!focusRun||!['work','rest'].includes(focusRun.phase)||!focusRun.items.some(sessionPending))return '';
 return '<button type="button" id="workoutPauseButton" class="workout-pause" data-session-action="pause" aria-label="Pause workout"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10"/></svg><span>Pause</span></button>';
}
function workoutActionsMarkup(){
 if(!focusRun||focusRun.phase==='finished')return '';
 const paused=focusRun.phase==='paused';
 return `<div class="workout-session-actions" role="group" aria-label="Workout actions"><button type="button" data-session-action="skip"${paused?' disabled':''}>Skip exercise</button><button type="button" data-session-action="swap"${paused?' disabled':''}>Swap exercise</button><button type="button" data-session-action="finish">Finish for today</button></div>`;
}
function sessionPausedView(){
 const x=focusItem(),t=x&&findTrack(x.id),p=validSessionPause(focusRun?.pauseSnapshot,x)?focusRun.pauseSnapshot:null;
 const older=focusRun&&dayOf(focusRun.started)!==dayOf(Date.now()),started=older?new Date(focusRun.started).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
 const st=t?sessionSpec(t):null,index=p?.kind==='hold'?p.i:x?.advancedDraft?.done?x.goals.findIndex((_,i)=>!x.advancedDraft.done.includes(i)):x?.values?.length||0;
 const set=Math.min(Math.max(0,index)+1,x?.goals?.length||1),clock=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
 const status=p?.kind==='rest'?'Rest paused · '+clock(p.remainingMs)+' left':p?.kind==='hold'?p.readyMs>0?'Get-ready countdown paused · '+Math.ceil(p.readyMs/1000)+' seconds left':'Hold paused · '+Math.floor(p.elapsedMs/1000)+' seconds elapsed'+(p.sides>1?' · side '+p.side:''):'Ready when you are.';
 const preview=t?`<div class="paused-next">${exerciseThumbnail(t,sessionLevel(t))}<div><p class="label">${p?.kind==='hold'?'Continue':'Up next'} · Set ${set} of ${x.goals.length}</p><h3>${esc(st[0])}</h3><p>${esc(p?.kind==='hold'?p.goal:x.goals[set-1])} ${isSec(st[4])?'seconds':'reps'}${st[4].includes('each')?' each side':''}</p><button type="button" id="focusHowTo" class="focus-howto paused-howto" data-ui="technique" aria-haspopup="dialog" aria-label="How to do ${esc(st[0])}">How to <span aria-hidden="true">→</span></button></div></div>`:'';

function handleSessionAction(button){
 const action=typeof button==='string'?button:button?.dataset?.sessionAction;
 if(action==='resume'){resumeWorkout();return;}

 if(action==='finish'){finishWorkoutToday();return;}
 if(action==='pause'){pauseWorkout();return;}
 if(!focusRun||focusRun.phase==='paused'||focusRun.phase==='finished')return;
 if(hold&&hold.tid!==focusItem()?.id){toast('Finish or cancel the running hold before changing this workout. Its timer is still running.');return;}
 const x=focusItem();if(!x||!sessionPending(x))return;
 if(action==='skip'){

 }
 if(action==='swap'){

/* ---------- keep things fresh ---------- */
const typing = () => document.activeElement?.matches?.("input,select,textarea");
let renderLater=false;
function softRender(){
  if(typing()||sheetOpen||document.querySelector('dialog[open]')){renderLater=true;return;}
  const active=document.activeElement,id=active?.id,action=active?.dataset.focus;
  if(!id&&!action&&$('#view').contains(active)&&active.matches('button,summary,a,[tabindex]')){renderLater=true;return;}

(async()=>{
  if(storageRecovery.active){setSync('local');return;}
  let dbApi=null, uid=null;
  try{
    dbApi = await window.claude?.use?.("db");
    const user = await window.claude?.use?.("user");
    uid = user ? await user.id() : null;
  }catch(e){}
  if(!dbApi || !uid){ setSync("local"); return; }
  connect(dbApi.doc("data/users/"+uid+"/state"));
})();
async function connect(ref){
  if(storageRecovery.active)return;
  setSync("syncing");
  let remote=null;
  for(let a=0;a<2 && remote===null;a++){
    try{ const snap=await ref.get(); remote = snap.exists ? normalize(snap.data()) : false; }
    catch(e){ if(a===0) await new Promise(r=>setTimeout(r,1500+Math.random()*1500)); }
  }
  if(storageRecovery.active)return;
  if(remote===null){ setSync("error"); setTimeout(()=>connect(ref),30000); return; }
  // Join this device's copy (including anything logged while we waited) with the cloud copy
  const merged = remote ? merge(state, remote) : state;
  const changedHere = !sameData(state, merged);
  state = merged; remember(); saveLocal();
  docRef = ref;
  if(!remote || !sameData(cloudSnapshot(merged), remote)) pushCloud(); else {cloudHistoryLimited=remote.historyPartial===true||remote.log.length<merged.log.length;setSync("ok");}
  if(changedHere || tab!=="today") softRender();
  // Live updates from your other devices
  listen(ref);
}
function listen(ref){
  try{
    ref.onSnapshot(snap=>{
      if(storageRecovery.active||!snap.exists || snap.metadata.hasPendingWrites)return;
      const other = normalize(snap.data());
      const m = merge(state, other);
      if(!sameData(m, state)){ state = m; remember(); saveLocal(); softRender(); }
      cloudHistoryLimited=other.historyPartial===true||other.log.length<m.log.length;setNote();
      if(!sameData(cloudSnapshot(m), other)) pushCloud();
    }, ()=>{ setTimeout(()=>{ if(docRef) listen(ref); }, 5000); });
  }catch(e){}
}
