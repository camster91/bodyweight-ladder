<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="img/icon.webp">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F55C9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ladder">
<meta name="description" content="Bodyweight training that plans your session from the time you have. Skill ladders, hold and rest timers, progress tracking.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bodyweight Ladder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow column, sticky tab bar at the bottom, cards = one exercise track each */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --ink:#16201B; --muted:#5C6B63; --line:#D5DDD8;
  --accent:#1F55C9; --accent-ink:#FFFFFF; --good:#1E7A4A; --good-bg:#DDF1E5; --chip:#E3E9F7; --bad:#B3261E; --toast-bg:#16201B; --toast-fg:#F3F6F4;
  --art-bg:#EEF2F8; --art-filter:none;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#18201B; --ink:#E8EEEA; --muted:#94A39B; --line:#2B3630; --art-bg:#CED7E5; --art-filter:brightness(.78);
  --accent:#7FA2FF; --accent-ink:#0C1530; --good:#6FD39C; --good-bg:#173226; --chip:#1E2A44; --bad:#FF8A80; --toast-bg:#2E3A33; --toast-fg:#E8EEEA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#18201B; --ink:#E8EEEA; --muted:#94A39B; --line:#2B3630; --art-bg:#CED7E5; --art-filter:brightness(.78);
  --accent:#7FA2FF; --accent-ink:#0C1530; --good:#6FD39C; --good-bg:#173226; --chip:#1E2A44; --bad:#FF8A80; --toast-bg:#2E3A33; --toast-fg:#E8EEEA; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand img{width:40px;height:40px;border-radius:11px;background:var(--accent)}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.brand span{font-size:13px;color:var(--muted)}
.cheer{width:72px;height:72px;flex:0 0 72px}
.levelup.big{gap:12px;justify-content:flex-start}
.levelup.big div{flex:1;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.empty img{width:160px;height:160px;margin:0 auto 8px;display:block}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:44px}
header.top img{width:34px;height:34px;border-radius:9px;background:var(--accent);flex:0 0 auto}
h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.01em;text-transform:uppercase;margin:0;line-height:1}
header.top .date{margin-left:auto}
.date{color:var(--muted);font-size:14px}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.track-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rung{display:flex;gap:3px;margin-top:6px}
.rung i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.rung i.on{background:var(--accent)}
.step-name{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;text-transform:uppercase}
.target{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);font-size:15px;white-space:nowrap;background:var(--chip);padding:4px 10px;border-radius:999px}
.cue{color:var(--muted);font-size:14px;margin:0}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sets>.set{min-width:0}
.set{display:flex;flex-direction:column;gap:4px}
.set label{font-size:12px;color:var(--muted)}
.set label span{float:right;color:var(--accent);font-weight:600}
.stepper{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stepper .sb{border:0;border-radius:0;min-height:48px;padding:0;width:34px;flex:0 0 34px;font-size:22px;color:var(--accent);background:transparent}
.stepper .sb:active{background:var(--chip)}
.stepper input{border:0!important;border-radius:0!important;padding:12px 0!important;min-width:0}
.move{display:flex;gap:14px;align-items:center}
.pic{width:112px;height:112px;flex:0 0 112px;border-radius:14px;background:var(--chip);object-fit:contain}
.move-text{min-width:0;display:flex;flex-direction:column;gap:4px}
.video{align-self:flex-start;font-weight:600;font-size:14px;color:var(--accent);text-decoration:none;border:1.5px solid var(--accent);border-radius:999px;padding:5px 12px;margin-top:2px}
@media(hover:hover) and (pointer:fine){.video:hover{background:var(--chip)}}
.video.sm{display:inline-block;margin-top:6px;padding:3px 10px;font-size:12px}
.thumb{width:48px;height:48px;flex:0 0 48px;border-radius:10px;background:var(--chip);object-fit:contain}
.set input{font:600 20px/1 var(--body);font-variant-numeric:tabular-nums;text-align:center;width:100%;box-sizing:border-box;padding:12px 4px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.set input:focus{outline:none;border-color:var(--accent)}
.set input.hit{border-color:var(--good);background:var(--good-bg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 15px var(--body);border-radius:10px;padding:12px 14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;min-height:44px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
button.ghost{flex:0 0 auto}
.last{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.levelup{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--good-bg);color:var(--good);border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px}
.levelup button{border-color:var(--good);color:var(--good);padding:8px 12px;min-height:38px}
.done{color:var(--good);font-weight:600;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
nav .tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{border:0;border-radius:0;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:14px 4px}
nav button[aria-current="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ladder li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ladder li:first-child{border-top:0}
.ladder .n{font-family:var(--display);font-weight:700;font-size:20px;width:24px;color:var(--muted);text-align:center}
.ladder .t{flex:1;min-width:0}
.ladder .t b{display:block;font-weight:600}
.ladder .t span{font-size:13px;color:var(--muted)}
.ladder li.cur .n{color:var(--accent)}
.ladder li.cur b{color:var(--accent)}
.ladder li.past .n{color:var(--good)}
.ladder button{padding:6px 10px;min-height:36px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.hist-day{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.hist-day:first-child{border-top:0}
.hist-day .d{font-weight:600}
.hist-day .e{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:16px}
.gear{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:4px}
[hidden]{display:none!important}
body.timing .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
#toastUndo{border:0;background:transparent;color:inherit;text-decoration:underline;font-weight:700;padding:4px 8px;min-height:44px;min-width:44px}
.step-name,.label,.ladder b,h2,.mini-t b,.mini-t span,.rrow b,.hid b,.pick span,.target{overflow-wrap:anywhere;min-width:0}
.track-head>div{min-width:0;flex:1}
.stepper input{flex:1 1 0;width:0!important;min-width:1.6em;font-size:1.2rem!important}
.stepper .sb{flex:0 0 auto}
@media (max-width:360px){.sets{grid-template-columns:1fr!important}.move{flex-direction:column;align-items:flex-start}
  .set{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(64px,90px) auto;gap:6px;align-items:center}
  .set label{grid-column:1;display:flex;flex-direction:column;line-height:1.2;white-space:nowrap}.set label span{float:none}.set input{grid-column:2;min-height:44px}.set .pm{grid-column:3}.pm button{width:44px;flex:0 0 44px}
  .seg.mins button{font-size:14px;padding:0 2px}}
.minrow{display:flex;align-items:center;gap:8px}
.minrow .seg{flex:1}
.step-name{hyphens:auto;-webkit-hyphens:auto}
#saveNote.warn{color:var(--bad);font-weight:600}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 6px 6px 18px;display:flex;align-items:center;gap:8px;z-index:8;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.timer #timerText{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;min-width:58px;white-space:nowrap}
.timer button{border-color:transparent;background:rgba(255,255,255,.18);color:inherit;padding:8px 12px;min-height:38px;border-radius:999px}
.chips-label{align-self:center;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;flex:0 0 auto;margin-right:2px}
.chip.rt[aria-pressed="false"]{border-style:dashed}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow>span{flex:1;min-width:0;display:flex;flex-direction:column}
.rrow>span span{font-size:13px;color:var(--muted)}
.rrow button{padding:6px 12px;min-height:36px;font-size:14px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pick{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;min-width:0}
.pick:has(input:checked){border-color:var(--accent);background:var(--chip)}
.pick input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.pick img{width:36px;height:36px;border-radius:8px;background:var(--bg);object-fit:contain;flex:0 0 auto}
.pick span{font-size:14px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:0 0 auto;border-radius:999px;min-height:36px;padding:6px 14px;font-size:14px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.summary{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.summary b{font-family:var(--display);font-size:22px;color:var(--accent)}
.muted{color:var(--muted);font-size:14px}
.next{color:var(--accent)}
.card.first{border-color:var(--accent);border-width:2px}
.sect{margin-top:10px}
button.icon{padding:4px 10px;min-height:34px;font-size:16px}
.mini{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mini img{width:52px;height:52px;flex:0 0 52px;border-radius:10px;background:var(--chip);object-fit:contain}
.mini-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mini-t b{font-weight:600;font-size:16px}
.mini-t span{font-size:13px;color:var(--muted);font-weight:400}
.mini-t span.ok{color:var(--good);font-weight:600}
.mini .chev{font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap}
.done-row{opacity:.8}
.pill{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--chip);border-radius:999px;padding:1px 7px;vertical-align:middle}
.ctl{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:10px;padding:10px 12px}
.ctl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl-row .label{width:72px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:1;min-width:0}
.seg button{flex:1;border:0;border-radius:0;min-height:38px;padding:6px 4px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mini-step{display:flex;align-items:center;gap:6px}
.mini-step button{min-height:36px;width:36px;padding:0;font-size:18px}
.mini-step b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
button.small{padding:6px 12px;min-height:36px;font-size:14px;margin-left:auto}
button.danger{margin-left:auto;padding:6px 12px;min-height:36px;font-size:14px;color:var(--bad);border-color:var(--bad)}
.hid{display:flex;align-items:center;gap:10px}
.hid img{width:44px;height:44px;border-radius:10px;background:var(--chip);object-fit:contain}
.hid>span{flex:1;min-width:0;display:flex;flex-direction:column}
.hid>span span{font-size:13px;color:var(--muted)}
.hid button{padding:6px 12px;min-height:36px;font-size:14px}
.addform{display:flex;flex-direction:column;gap:8px}
.addform label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
.addform input,.addform select{font:500 16px var(--body);width:100%;box-sizing:border-box;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3>div{min-width:0}
/* --- Today --- */
.dot{width:10px;height:10px;min-height:0;padding:0;border:0;border-radius:50%;flex:0 0 auto;background:var(--line);box-shadow:0 0 0 14px transparent;position:relative}
.dot::after{content:"";position:absolute;inset:-17px}
.dot.ok{background:var(--good)} .dot.syncing{background:var(--accent)} .dot.error{background:var(--bad)} .dot.readonly{background:var(--muted)}
.syncwarn{width:100%;margin-bottom:10px;min-height:40px;border-color:var(--bad);color:var(--bad);font-size:14px}
.planbar{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.seg.mins button{min-height:44px;font-size:15px;font-weight:600}
.showbtn{width:100%;text-align:left;background:var(--surface);font-weight:500;display:flex;gap:6px;align-items:center}
.showbtn b{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.planline{margin:2px 0 10px;color:var(--muted);font-size:15px}
.planline b{font-family:var(--display);font-size:22px;color:var(--accent)}
.welcome{display:flex;gap:12px;align-items:center;background:var(--good-bg);color:var(--good);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.welcome img{width:56px;height:56px;flex:0 0 auto}
.welcome div{display:flex;flex-direction:column;min-width:0}
.welcome span{font-size:14px}
.fold{width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;border-style:dashed;color:var(--muted)}
.fold span{font-family:var(--display);font-size:18px;color:var(--accent)}
.star{color:var(--accent);font-size:14px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:80vh;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.opt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:0;background:var(--bg);min-width:0}
.opt b{overflow-wrap:anywhere}
.opt span{font-size:12px;color:var(--muted);font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--chip)}
button.icon{min-width:44px;min-height:44px;padding:0;font-size:16px;flex:0 0 auto}
/* --- logging card --- */
.pic{width:96px!important;height:96px!important;flex:0 0 96px!important}
.holdbtn{width:100%;min-height:56px;font-size:17px;background:var(--chip);border-color:var(--accent);color:var(--accent);font-weight:700}
.set input{font:700 1.5rem/1 var(--body)!important;padding:10px 4px!important;min-height:52px}
.pm{display:flex;gap:6px}
.pm button{flex:1;min-height:44px;padding:0;font-size:22px;color:var(--accent);background:var(--bg)}
.set.timed input{border-color:var(--good)}
.stepdown{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted)}
.stepdown button{min-height:40px;padding:6px 12px;font-size:14px}
/* --- Exercises --- */
.between{align-items:center;justify-content:space-between;flex-wrap:nowrap}
.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.exrow img{width:48px;height:48px;flex:0 0 48px;border-radius:10px;background:var(--chip);object-fit:contain}
.exopen{padding:0;overflow:hidden}
#routinesCard:has(.plain){padding:0;overflow:hidden}
.exrow.plain{border:0}
.exopen .exrow{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.exopen .ctl,.exopen .ladder{margin:0 12px}
.exopen .ladder{margin-bottom:8px}
.sticky-actions{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--surface);padding:10px 0;border-top:1px solid var(--line);z-index:3}
/* --- History --- */
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow img{width:40px;height:40px;border-radius:8px;background:var(--chip);object-fit:contain;flex:0 0 auto}
.spark{flex:0 0 auto}
.hist-day .e{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist-day .e span{min-width:0}
.erow{flex:1;min-width:0;text-align:left;border:0;padding:6px 0;min-height:40px;font:inherit;font-size:14px;color:var(--muted);background:transparent}
.hist-day .e.sel{background:var(--bg);border-radius:8px;padding:0 6px}
.xdel{min-height:40px;padding:0 14px;font-size:14px;color:var(--bad);border-color:var(--bad)}
.cheerline{color:var(--good)!important;font-weight:600}

function applySwap(id,lvl){
 if(!canSwapItem())return;
 const p=swapPreview(id,lvl);if(!p)return;
 const original=JSON.parse(JSON.stringify(focusItem())),index=focusRun.at,otherIndex=focusRun.items.findIndex(a=>a.id===id&&a.id!==original.id);
 const existing=otherIndex>=0?{index:otherIndex,item:JSON.parse(JSON.stringify(focusRun.items[otherIndex]))}:null;
 const at=focusRun.items.slice(0,index).filter(a=>a.id!==id).length;
 const replacement={id,key:keyOf(p.t,lvl),goals:p.goals,values:[],...(p.light?{mode:'light'}:{}),swap:{original,index,...(existing?{existing}:{})}};
 focusRun.items=focusRun.items.filter(a=>a.id!==original.id&&a.id!==id);focusRun.items.splice(at,0,replacement);focusRun.at=at;
 for(const tid of new Set([id,original.id])){delete drafts[tid];delete completedSets[tid];delete holdNext[tid];}
 focusUndo=null;swapChoice=null;readinessChoice=null;persistFocus();render();$('#focusAnnouncement').textContent=p.st[0]+' selected for this workout.';$('#focusPrimary')?.focus({preventScroll:true});
}
function restoreSwap(){
 const x=focusItem();if(!canSwapItem(x)||!x.swap)return;
 const s=x.swap,restore=[{index:s.index,item:s.original},...(s.existing?[s.existing]:[])];
 if(!restore.every(r=>Number.isInteger(r.index)&&r.index>=0&&r.item&&findTrack(r.item.id)&&Array.isArray(r.item.values)&&!r.item.values.length&&!r.item.entry))return;
 const items=focusRun.items.filter(a=>a!==x);
 if(restore.some(r=>items.some(a=>a.id===r.item.id)))return;
 for(const r of restore.sort((a,b)=>a.index-b.index))items.splice(Math.min(r.index,items.length),0,JSON.parse(JSON.stringify(r.item)));
 focusRun.items=items;focusRun.at=items.findIndex(a=>a.id===s.original.id);
 for(const r of [x,...restore.map(r=>r.item)]){delete drafts[r.id];delete completedSets[r.id];delete holdNext[r.id];}
 focusUndo=null;swapChoice=null;persistFocus();render();$('#focusAnnouncement').textContent='Original exercise restored.';$('#focusPrimary')?.focus({preventScroll:true});
}
function handleSwap(b){
 if(!canSwapItem())return;
 if(b.dataset.swap==='restore'){restoreSwap();return;}
 if(b.dataset.swap==='choose'){
  const id=b.dataset.t,lvl=+b.dataset.level;if(!swapPreview(id,lvl))return;
  swapChoice={id,lvl};render();document.querySelector(`[data-swap="choose"][data-t="${id}"][data-level="${lvl}"]`)?.focus({preventScroll:true});return;
 }
 if(b.dataset.swap==='apply'&&swapChoice){applySwap(swapChoice.id,swapChoice.lvl);return;}
 if(b.dataset.swap==='cancel'){swapChoice=null;render();document.querySelector('.swap-picker>summary')?.focus({preventScroll:true});}
}

function resumeFocus(){stopTimer();focusRun.phase='work';focusRun.restEnd=0;persistFocus();render();$('#focusPrimary')?.focus({preventScroll:true});}
function completeFocus(value=focusValue()){
  const x=focusItem();if(!x||focusRun.phase!=='work'||x.entry)return;
  if(hold){toast('Finish or cancel the running hold first.');return;}
  const t=findTrack(x.id),st=sessionSpec(t),before=JSON.parse(JSON.stringify(focusRun));before.items[before.at].value=value;
  const vals=[...x.values,value];let entry=null;
  if(vals.length===st[1]){
    drafts[t.id]=vals.map(String);entry=saveSets(t,{focus:true});if(!entry)return;x.entry=entryId(entry);
  }
  x.values=vals;delete x.value;focusUndo={before,entry};
  if(!entry){drafts[t.id]=x.goals.map((v,i)=>String(x.values[i]??v));completedSets[t.id]=new Set(x.values.map((_,i)=>i));}
  if(entry){const next=focusRun.items.findIndex(a=>!a.entry);if(next<0)focusRun.phase='finished';else focusRun.at=next;}
  if(entry)showFocusSaved(st[0]);else clearFocusNotice();
  if(focusRun.phase!=='finished'){focusRun.phase='rest';focusRun.restDuration=restOf(t,st);focusRun.restEnd=Date.now()+focusRun.restDuration*1000;startRest(focusRun.restDuration,focusRun.restEnd);}
  persistFocus();pulseFocusCompletion();render();$('#focusPrimary')?.focus({preventScroll:true});
  // The rest/completion screen already confirms the action and keeps Undo available.
  hideToast();
}
function undoFocus(){
  if(!focusUndo)return;$('#focusEffects').replaceChildren();clearFocusNotice();stopTimer();const u=focusUndo;focusUndo=null;
  if(u.entry){state.log=state.log.filter(e=>entryId(e)!==entryId(u.entry));state.deleted=[...state.deleted,entryId(u.entry)].slice(-TOMB_KEEP);commit();}
  focusRun=u.before;focusRun.phase='work';focusRun.restEnd=0;delete drafts[focusItem().id];delete completedSets[focusItem().id];persistFocus();hideToast();render();$('#focusPrimary')?.focus({preventScroll:true});
}
function handleFocus(b){
  const a=b.dataset.focus,x=focusItem(),t=x&&findTrack(x.id);
  if(a==='progress'){go('history');return;}
  if(a==='another'){stopTimer();focusRun=null;focusUndo=null;persistFocus();render();return;}
  if(a==='undo'){undoFocus();return;}
  if(a==='skip'){resumeFocus();return;}
  if(a==='add'){addFocusRest();return;}
  if(a==='choose'){if(hold){toast('Finish or cancel the running hold first.');return;}stopTimer();focusRun.at=+b.dataset.i;focusRun.phase='work';persistFocus();render();return;}
  if(!t)return;
  if(a==='plus'||a==='minus'){const previous=focusValue();x.value=Math.min(9999,Math.max(0,previous+(a==='plus'?1:-1)*stepInc(sessionSpec(t))));persistFocus();rollFocusNumber(previous,x.value);return;}
  if(a==='complete'){completeFocus();return;}
  if(a==='hold'){if(hold)return;holdNext[t.id]=x.values.length;startHold(t);hold.focus=true;hold.goal=focusValue();render();return;}
  if(a==='finish'){finishHold();return;}
  if(a==='cancel'){stopTimer();render();}
}

function viewToday(){
  const shown=allTracks().filter(t=>!isHidden(t.id));
  const routine = filter.startsWith("r:") ? state.routines.find(r=>"r:"+r.id===filter) : null;
  if(filter.startsWith("r:") && !routine && sync!=="starting" && sync!=="syncing") filter="All";
  const vis = routine ? routine.items.map(findTrack).filter(t=>t&&!isHidden(t.id))
    : shown.filter(t=>filter==="All"||groupOf(t)===filter);
  const top = `<div class="planbar">
      <div class="minrow"><span class="label">Minutes</span><div class="seg mins" role="group" aria-label="Minutes you have">${MIN_OPTS.map(m=>`<button data-ui="min" data-m="${m}" aria-pressed="${minutes===m}" aria-label="${m?m+" minutes":"All moves"}">${m||"All"}</button>`).join("")}</div></div>
      <button class="showbtn" data-ui="sheet" aria-haspopup="dialog">Showing: <b>${esc(currentFilterName())}</b> ▾</button>
    </div>`;
  if(!vis.length){
    return top+`<div class="card empty"><img src="img/cheer.webp" alt=""><h2>Nothing to show</h2><p>${routine&&routine.items.length?"Every move in this routine is hidden. Add them back on the Exercises tab.":routine?"This routine has no moves yet. Edit it on the Exercises tab.":filter==="All"?"Everything is hidden. Add moves back on the Exercises tab.":`Every ${esc(filter)} move is hidden. Add them back on the Exercises tab.`}</p></div>`;
  }
  const recent=vis.filter(t=>recentlyDone(t)).sort((a,b)=>lastFor(b.id).ts-lastFor(a.id).ts);
  const due=vis.filter(t=>!recentlyDone(t) && lastFor(t.id)).sort((a,b)=>score(b)-score(a));
  // New moves in a balanced order (push, legs, core, pull…) so a first session isn't all upper body
  const PATTERN=["push","squat","core","row","hinge","pull","dip"];
  const pat=t=>{ const i=PATTERN.indexOf(t.id); return i<0?99+allTracks().indexOf(t):i; };
  const fresh=vis.filter(t=>!lastFor(t.id)).sort((a,b)=>(FOCUS[focusOf(b.id)]-FOCUS[focusOf(a.id)]) || (pat(a)-pat(b)));
  const veteran = state.log.length>0;
  // Fill the time you have: overdue moves first, at most one new move if you already train
  const plan=[]; let used=0, newCount=0;
  const fits = t => minutes===0 || plan.length===0 || used+minutesFor(t) <= minutes+1;
  for(const t of due){ if(fits(t)){ plan.push(t); used+=minutesFor(t); } }
  const capNew = veteran && filter==="All";   // a routine or type you picked gets filled with its own moves
  for(const t of fresh){ if(capNew && newCount>=1) break; if(fits(t)){ plan.push(t); used+=minutesFor(t); newCount++; } }
  ensureFocus(plan);
  const frozenIds=new Set(focusRun.items.flatMap(x=>[x.id,...(x.swap?[x.swap.original.id]:[])]));
  const more=[...due,...fresh].filter(t=>!frozenIds.has(t.id));
  return focusView(plan,top,more,recent);
}

function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function spark(entries){
  // total reps or seconds per session, oldest → newest; a new colour where the step changed
  const vals=entries.map(e=>e.sets.reduce((a,b)=>a+b,0)); const W=120,H=32,max=Math.max(...vals,1),min=Math.min(...vals,0);
  const x=i=>vals.length<2?W/2:4+i*(W-8)/(vals.length-1), y=v=>H-4-(H-8)*((v-min)/((max-min)||1));
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const marks=entries.map((e,i)=>i>0&&e.k!==entries[i-1].k?`<line x1="${x(i)}" x2="${x(i)}" y1="2" y2="${H-2}" stroke="var(--good)" stroke-dasharray="2 2"/>`:"").join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${marks}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="3" fill="var(--accent)"/></svg>`;
}
// Compare totals only within the same step and recorded set count.
function personalBests(log=state.log){
  const groups=new Map();
  for(const e of [...log].sort((a,b)=>a.ts-b.ts)){
    if(!stepByKey(e.k))continue;
    const key=e.k+'|'+e.sets.length;
    if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e);
  }
  const records=[];
  for(const entries of groups.values()){
    const total=e=>e.sets.reduce((a,b)=>a+b,0);
    let best=entries[0];
    for(const e of entries.slice(1))if(total(e)>total(best))best=e;
    if(best!==entries[0])records.push({entry:best,total:total(best),gain:total(best)-total(entries[0]),count:best.sets.length});
  }
  return records.sort((a,b)=>b.entry.ts-a.entry.ts);
}
function trainingDays(log=state.log){
  const days=new Map();
  for(const e of log){const key=dayOf(e.ts);if(!days.has(key))days.set(key,[]);days.get(key).push(e);}
  return [...days].sort((a,b)=>b[0].localeCompare(a[0])).map(([date,entries])=>({date,entries,exercises:new Set(entries.map(e=>e.t)).size,sets:entries.reduce((n,e)=>n+e.sets.length,0)}));
}
function viewHistory(){
  if(!state.log.length)return `<section class="progress-empty"><h2>A record of your training.</h2><p>Complete an exercise to start your history. Personal bests appear when you improve on a previous result.</p><button class="primary" data-ui="gotoday">Go to Today</button></section>`;
  const days=trainingDays(),start=weekStart(new Date()).getTime(),now=Date.now();
  const thisWeek=state.log.filter(e=>e.ts>=start&&e.ts<=now),weekDays=new Set(thisWeek.map(e=>dayOf(e.ts))).size,weekSets=thisWeek.reduce((n,e)=>n+e.sets.length,0);
  const weekActivity=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const key=dayOf(+d),sets=thisWeek.filter(e=>dayOf(e.ts)===key).reduce((n,e)=>n+e.sets.length,0);return `<div class="week-day${sets?' active':''}${key===dayOf(now)?' today':''}" role="listitem" aria-label="${fmtDate(key)}: ${sets} sets recorded"><span>${d.toLocaleDateString(undefined,{weekday:'short'})}</span><i class="week-count" aria-hidden="true">${sets||'–'}</i></div>`;}).join('');
  const records=personalBests();
  const timeline=days.slice(0,5).map(d=>`<li class="training-day"><span class="training-rung" aria-hidden="true"></span><div><time datetime="${d.date}">${fmtDate(d.date)}</time><span>${d.exercises} ${d.exercises===1?'exercise':'exercises'} · ${d.sets} ${d.sets===1?'set':'sets'}</span></div></li>`).join('');
  const bestHtml=records.slice(0,4).map(({entry,total,count})=>{
    const f=stepByKey(entry.k),measure=isSec(f.st[4])?'seconds':'reps',side=f.st[4].includes('each')?' per side':'';
    return `<div class="personal-best" data-record="${esc(entry.k)}" data-count="${count}"><h3>${esc(f.st[0])}</h3><p class="record-value">${total} <span>${measure}${side}</span></p><p class="record-context">${count}-set total · <time datetime="${dayOf(entry.ts)}">${fmtDate(dayOf(entry.ts))}</time></p></div>`;
  }).join('');
  const prog=allTracks().map(t=>{const es=state.log.filter(e=>e.t===t.id).sort((a,b)=>a.ts-b.ts);return es.length?{t,es}:null;}).filter(Boolean).sort((a,b)=>b.es.at(-1).ts-a.es.at(-1).ts);
  const progHtml=prog.map(({t,es})=>{
    const lvl=lvlOf(t),st=t.steps[lvl],atCur=es.filter(e=>e.k===keyOf(t,lvl)),last=atCur.at(-1);
    const comparable=last?atCur.filter(e=>e.sets.length===last.sets.length):[],first=comparable[0];
    let change='No saved sets on this step yet.',note='',positive=false;
    if(last){
      change=last.sets.join(' · ')+(isSec(st[4])?'s':' reps')+(st[4].includes('each')?' per side':'');
      if(comparable.length>=2){
        const gain=last.sets.reduce((a,b)=>a+b,0)-first.sets.reduce((a,b)=>a+b,0),measure=isSec(st[4])?'seconds':'reps',side=st[4].includes('each')?' per side':'';
        change=first.sets.join(' · ')+' → '+last.sets.join(' · ')+(isSec(st[4])?'s':' reps')+side;
        const baseline=first===atCur[0]?'since you started this step':'since your first '+last.sets.length+'-set result';
        note=gain>0?'+'+gain+' '+measure+side+' '+baseline:gain===0?'Holding steady. Same total as your first matching result.':Math.abs(gain)+' fewer '+measure+side+' than your first matching result.';positive=gain>0;
      }else note='First recorded '+last.sets.length+'-set result on this step.';
    }
    return `<div class="prow"><span class="mini-t"><b>${esc(st[0])}</b><span>${esc(change)}</span>${note?`<span class="progress-note${positive?' positive':''}">${esc(note)}</span>`:''}<span>${last?`${comparable.length} ${comparable.length===1?'matching result':'matching results'} · ${last.sets.length} ${last.sets.length===1?'set':'sets'}`:`Last logged: ${esc(stepByKey(es.at(-1).k)?.st[0]||'previous step')}`}</span></span>${comparable.length?spark(comparable.slice(-12)):''}</div>`;
  }).join('');
  const recent=days.slice(0,14).map(({date,entries})=>`<div class="hist-day"><span class="d">${fmtDate(date)}</span>${[...entries].sort((a,b)=>b.ts-a.ts).map(e=>{
    const f=stepByKey(e.k),id=entryId(e),tm=new Date(e.ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}),sel=confirmDel==='e:'+id;
    return `<div class="e${sel?' sel':''}"><button class="erow" data-ui="selentry" data-id="${esc(id)}" aria-expanded="${sel}">${tm} · ${f?esc(f.st[0]):'Removed exercise'}: ${e.sets.join(' · ')}${f?unit(f.st[4]):''}${e.mode==='light'?' · Lighter day':''}${e.insteadOf?' · Instead of '+esc(stepByKey(e.insteadOf)?.st[0]||'original exercise'):''}</button>${sel?`<button class="xdel" data-ui="delentry" data-id="${esc(id)}">Delete</button>`:''}</div>`;
  }).join('')}</div>`).join('');
  return `<div class="progress-page"><section class="progress-week" aria-label="This week"><p class="label">This week</p><div class="progress-stats"><div><b>${weekDays}</b><span>${weekDays===1?'day':'days'} trained</span></div><div><b>${weekSets}</b><span>sets recorded</span></div></div><div class="week-activity" role="list" aria-label="Recorded sets by day">${weekActivity}</div><p class="week-legend">Recorded sets by day</p></section>
    <div class="progress-columns"><section class="progress-section"><h2>Personal bests</h2><p class="progress-caption">${records.length>4?'Most recent four. ':''}From saved history. Same step and set count.</p>${bestHtml||'<p class="records-empty">A best appears when you exceed a previous total. Your first result sets the baseline.</p>'}</section>
    <section class="progress-section"><h2>Training days</h2><p class="progress-caption">${days.length} ${days.length===1?'day':'days'} recorded${days.length>5?' · Most recent five':''}</p><ol class="training-ladder">${timeline}</ol></section></div>
    <section class="progress-section progress-exercises"><h2>Your progress</h2><p class="progress-caption">Current exercise steps. Each trend compares the same number of sets.</p>${progHtml}</section>
    <details class="progress-log" id="progressLog" ${progressLogOpen?'open':''}><summary>Workout log <span>View or correct saved entries</span></summary><p class="progress-caption">Tap an entry to delete it.</p>${recent}</details></div>`;
}

  return `<details class="onboard-plan"><summary><b>Explore your plan</b><span>Exercises, starting steps & technique</span></summary><div class="onboard-plan-content"><p class="cue">These are your available exercise ladders. Today picks a smaller workout based on your time and recent training.</p>${SETUP_GROUPS.map(([g,label])=>{const ts=tracks.filter(t=>groupOf(t)===g);if(!ts.length)return '';return `<h3 class="label">${label}</h3>${ts.map(t=>{const lvl=setupPreviewLevel(t),st=spec(t,lvl);return `<details class="plan-exercise" data-preview-track="${t.id}" data-preview-step="${lvl}"><summary>${movementMark(t)}<span><b>${esc(t.name)}</b><small>${esc(st[0])} · Step ${lvl+1}/${t.steps.length}</small></span></summary><div class="plan-exercise-body"><p class="plan-prescription">${targetText(st)}</p><p class="cue">${esc(st[5])}</p>${st[6]!=='None'?`<p class="plan-gear">Needs: ${esc(st[6])}</p>`:''}<img src="${imgOf(t,lvl)}" alt="${esc(st[0])} demonstrated by Rung" loading="lazy" width="900" height="600"><a class="video" href="${ytLink(st[0])}" target="_blank" rel="noopener">Watch video tutorial ↗</a>${t.steps.length>1?`<details class="plan-progression"><summary>See all ${t.steps.length} steps</summary><ol>${t.steps.map((s,i)=>`<li${i===lvl?' aria-current="step"':''}><span>${esc(s[0])}</span>${i===lvl?'<small>Your starting step</small>':''}</li>`).join('')}</ol></details>`:''}</div></details>`;}).join('')}`;}).join('')}</div></details>`;
}

const SETUP_GROUPS=[['Strength','Strength','Push, pull and build control.'],['Tendon','Tendons & joints','Controlled strength for smaller movements.'],['Mobility','Mobility','Move through a wider range.'],['Stretch','Stretching','Make room to move.'],['Weights','Carries & swings','Add weight to your training.']];
let setupStage=0,setupError='',setupIntro=false;
let setupIntroRequested=new URLSearchParams(location.search).get('onboarding')==='1';
function saveSetupDraft(){if(state.prefs.setupDone||state.log.length)return;store.set('bwl-onboarding',JSON.stringify({v:1,stage:setupStage,groups:[...setupDraft.groups],gear:[...setupDraft.gear],level:setupDraft.level}));}
function clearSetupDraft(){store.set('bwl-onboarding','null');setupDraft=null;setupStage=0;setupError='';}
function setupHasExercises(){return setupAvailableCount()>0;}
function setupMove(stage){
  if(stage>setupStage&&setupStage===1&&!setupDraft.groups.size){setupError='Choose at least one focus to continue.';render();$('#setupError')?.focus();return;}
  if(stage>setupStage&&setupStage===2&&!setupHasExercises()){setupError='Carries and swings need weights. Choose weights, or go back and add another focus.';render();$('#setupError')?.focus();return;}
  setupStage=Math.max(0,Math.min(4,stage));setupError='';saveSetupDraft();render();window.scrollTo(0,0);$('#setupTitle')?.focus({preventScroll:true});
}
function viewSetup(){
  const redo=state.prefs.setupDone||state.log.length>0;
  if(!setupDraft){
    setupDraft=redo?{groups:new Set(['Strength','Tendon','Mobility','Stretch','Weights'].filter(g=>TRACKS.some(t=>groupOf(t)===g&&!isHidden(t.id)))),gear:new Set([...(!isHidden('pull')?['bar']:[]),...(TRACKS.some(t=>groupOf(t)==='Weights'&&!isHidden(t.id))?['weights']:[])]),level:'keep'}:{groups:new Set(['Strength','Tendon','Mobility','Stretch']),gear:new Set(),level:'some'};
    setupStage=redo&&!setupIntro?1:0;setupError='';
    if(!redo)try{const d=JSON.parse(store.get('bwl-onboarding','null'));if(d?.v===1&&Number.isInteger(d.stage)&&d.stage>=0&&d.stage<=4&&Array.isArray(d.groups)&&d.groups.every(g=>SETUP_GROUPS.some(x=>x[0]===g))&&Array.isArray(d.gear)&&d.gear.every(g=>['bar','weights'].includes(g))&&['new','some','strong'].includes(d.level)){setupDraft={groups:new Set(d.groups),gear:new Set(d.gear),level:d.level};setupStage=d.stage;}}catch(e){}
  }
  if(setupIntro){setupStage=0;setupIntro=false;}
  const d=setupDraft,stage=setupStage;
  const choice=(kind,value,label,description)=>{const selected=kind==='level'?d.level===value:kind==='none'?!d.gear.size:d[kind].has(value);return `<button class="onboard-choice" data-ui="${kind==='none'?'onone':'stog'}" data-kind="${kind}" data-v="${value}" aria-pressed="${selected}"><span class="choice-art" aria-hidden="true">${uiGlyph(kind==='none'?'none':value==='weights'?'Weights':value)}</span><span class="choice-copy"><b>${label}</b><small>${description}</small></span><span class="onboard-select" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7"/></svg></span></button>`;};
  const headings=['Your workout.\nOne set at a time.','What would you like to work on?','What do you have available?','Where are you starting?',redo?'Review your changes.':'Ready for your first set.'];
  const subtitles=['A plan that fits your time, with clear steps as you get stronger.','Choose the areas you want in your workouts.','Most moves use a wall, a chair or the floor. Extra equipment is optional.','Choose a starting point. You can change individual exercises later.','Your plan will use these choices. Change them anytime in Exercises.'];
  const symbol=`<figure class="onboard-art"><picture><source media="(max-width:700px)" srcset="assets/brand/editorial-hero-v1-small.webp"><img src="assets/brand/editorial-hero-v1.webp" alt="An athlete training beside blue architectural steps" width="1120" height="1400" fetchpriority="high"></picture></figure>`;
  let html=`<section class="setup onboard" data-step="${stage}"><div class="onboard-meta"><span>Bodyweight Ladder</span>${stage>0?`<span>${stage<4?'Step '+stage+' of 3':'Review'}</span>`:''}</div>${stage>0?`<div class="onboard-progress" aria-hidden="true">${[1,2,3].map(i=>`<span class="${stage>=i?'on':''}"></span>`).join('')}</div>`:symbol}<div class="onboard-heading"><h2 id="setupTitle" tabindex="-1">${headings[stage].split('\n').map(esc).join('<br>')}</h2><p>${subtitles[stage]}</p></div>`;
  if(stage===0)html+=`<div class="onboard-preview" aria-label="How a workout works">${[['work','Work','One set'],['rest','Rest','A timed break'],['repeat','Repeat','The next set']].map(([icon,label,detail])=>`<div>${uiGlyph(icon)}<b>${label}</b><small>${detail}</small></div>`).join('')}</div>`;
  if(stage===1)html+=`<div class="onboard-options" role="group" aria-label="Training focus">${SETUP_GROUPS.map(([value,label,description])=>choice('groups',value,label,description)).join('')}</div>`;
  if(stage===2)html+=`<div class="onboard-options" role="group" aria-label="Available equipment">${choice('none','','No extra equipment','A wall, a chair and some floor space.')}${choice('gear','bar','Pull-up bar','Include hanging and pulling movements.')}${choice('gear','weights','Weights','A jug, kettlebell or other suitable weight.')}</div>`;
  if(stage===3)html+=`<div class="onboard-options" role="group" aria-label="Starting level">${redo?choice('level','keep','Keep my current steps','Use the exercise levels I have now.'):''}${choice('level','new','New to this','Start with easier variations.')}${choice('level','some','Some experience','Use the standard starting steps.')}${choice('level','strong','Already training','Begin further along the exercise ladders.')}</div>${redo?'<p class="onboard-footnote">Exercises you have already logged keep their current step.</p>':''}`;
  if(stage===4){const labels=SETUP_GROUPS.filter(([g])=>d.groups.has(g)).map(([,label])=>label.replace('&amp;','&'));const gear=d.gear.size?GEAR.filter(([g])=>d.gear.has(g)).map(([,label])=>label).join(', '):'No extra equipment';const level={keep:'Keep my current steps',new:'Start with easier variations',some:'Standard starting steps',strong:'Start further along'}[d.level];html+=`<div class="onboard-pool">${uiGlyph('keep')}<div><b>${setupAvailableCount()}</b><span>exercise ladders match your choices</span></div></div>${setupPlanPreview()}<dl class="onboard-review">${[['Focus',labels.join(', '),1],['Equipment',gear,2],['Starting point',level,3]].map(([label,value,step])=>`<div><dt>${label}</dt><dd>${esc(value)}</dd><button data-ui="oedit" data-step="${step}" aria-label="Edit ${label.toLowerCase()}">Edit</button></div>`).join('')}</dl>`;}
  html+=`<p id="setupError" class="onboard-error" role="alert" tabindex="-1">${esc(setupError)}</p><div class="onboard-actions"><button class="primary" data-ui="${stage===4?'finish':'onext'}">${stage===0?'Set up my workout':stage===4?(redo?'Save changes':'Start my workout'):'Continue'}</button>${stage>0?'<button class="onboard-back" data-ui="oback">Back</button>':''}<button class="onboard-skip" data-ui="skip">${redo?'Cancel':'Set up later'}</button></div><p class="onboard-footnote">${redo?'Your saved workouts stay with you.':'No account required. Progress saves in this browser.'}</p></section>`;
  return html;
}

const START = {
  new:   {push:1,dip:0,pull:0,row:0,squat:0,core:1,hinge:0},
  some:  {},
  strong:{push:4,dip:2,pull:4,row:2,squat:3,core:3,hinge:1}
};
function finishSetup(skip){
  if(!skip){
    const d=setupDraft;
    for(const t of TRACKS){
      let hide = !d.groups.has(groupOf(t));
      if(!d.gear.has("bar") && (t.id==="pull"||t.id==="hang")) hide=true;
      if(!d.gear.has("weights") && groupOf(t)==="Weights") hide=true;
      if(hide) state.prefs.hidden[t.id]=true; else delete state.prefs.hidden[t.id];
    }
    // Starting steps only for exercises you haven't logged yet, so redoing setup never undoes progress
    const used=new Set(state.log.map(e=>e.t));
    for(const [id,i] of Object.entries(START[d.level]||{})){ const t=findTrack(id); if(t && !used.has(id)) state.levels[id]=keyOf(t,Math.min(i,t.steps.length-1)); }
  }
  state.prefs.setupDone=true; clearSetupDraft(); setupWanted=false; tab="today"; filter="All"; store.set("bwl-filter","All");
  // If your account hasn't loaded, these answers only fill gaps and never replace saved settings
  commit(sync!=="ok" && sync!=="local"); render(); window.scrollTo(0,0);
  if(!skip){$("#focusAnnouncement").textContent="Your workout is ready.";const h=$(".focus-stage h2");if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}
}

function render(){
  idx=null;
  document.body.dataset.view=tab;
  // First visit: ask the setup questions, but only once we know this account has nothing saved yet
  const fresh = !state.prefs.setupDone && !state.log.length;
  if(setupIntroRequested&&(!fresh||!['starting','syncing','error'].includes(sync))){
    setupIntroRequested=false;setupIntro=true;setupWanted=true;setupDraft=null;tab='setup';
    const url=new URL(location.href);url.searchParams.delete('onboarding');history.replaceState(history.state,'',url);
  }
  if(fresh && sync==="error" && tab!=="setup"){ document.body.classList.add("in-setup"); $("#viewTitle").textContent="Welcome"; $("#view").innerHTML=`<div class="card empty"><img src="img/cheer.webp" alt=""><h2>Can't reach your account</h2><p>If you've used Bodyweight Ladder before, your progress will load once you're back online. Retrying…</p><button class="ghost" data-ui="forcesetup" style="margin-top:8px">I'm new here. Set me up</button></div>`; return; }
  if(fresh && sync!=="starting" && sync!=="syncing" && tab!=="setup") tab="setup";
  if(!fresh && tab==="setup" && !setupWanted) tab="today";
  if(fresh && (sync==="starting"||sync==="syncing") && tab!=="setup"){ document.body.classList.add("in-setup"); $("#viewTitle").textContent="Welcome"; $("#view").innerHTML=`<div class="card empty"><img src="img/cheer.webp" alt=""><h2>Loading your progress…</h2></div>`; return; }
  document.body.classList.toggle("in-setup", tab==="setup");
  document.body.dataset.view=tab;
  $("#viewTitle").textContent={today:"Today",ladders:"Exercises",history:"Progress",setup:"Welcome"}[tab];
  const logDisclosure=$("#progressLog");if(logDisclosure)progressLogOpen=logDisclosure.open;
  const previousOnboard=$(".onboard")?.dataset.step;
  const previousStage=$(".focus-stage")?.dataset.stage;
  $("#view").innerHTML = tab==="today"?viewToday():tab==="ladders"?viewLadders():tab==="history"?viewHistory():viewSetup();
  const stage=$(".focus-stage");if(stage&&previousStage&&stage.dataset.stage!==previousStage)stage.classList.add(stage.dataset.phase==="finished"?"focus-celebrate":"focus-enter");
  const onboarding=$(".onboard");if(onboarding&&previousOnboard!==undefined&&onboarding.dataset.step!==previousOnboard){onboarding.classList.add("onboard-enter");if(+onboarding.dataset.step<+previousOnboard)onboarding.classList.add("onboard-reverse");}
  if(onboarding)onboarding.querySelector('.onboard-meta>span').insertAdjacentHTML('afterbegin',uiGlyph('keep'));
  if(previousOnboard!==undefined&&stage)stage.classList.add("focus-enter");
  const number=$("#focusValue");if(number)number.dataset.wide=String(focusValue()>=1000);
  document.body.classList.toggle("focus-timing",tab==="today"&&(focusRun?.phase==="rest"||!!hold?.focus));
  if(tab==="ladders" && exQuery) applySearch();
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===tab?"true":"false"));
}

let tt, undoFn=null;
function toast(msg, undo){
  $("#toastMsg").textContent=msg; undoFn=undo||null; $("#toastUndo").hidden=!undo;
  const t=$("#toast"); t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>{ t.hidden=true; undoFn=null; }, undo?5000:2200);
}
$("#toastUndo").addEventListener("click",()=>{ const f=undoFn; undoFn=null; $("#toast").hidden=true; if(f) f(); });
const hideToast=()=>{ $("#toast").hidden=true; undoFn=null; };

/* ---------- events ---------- */
function go(t){ tab=t; confirmDel=null; editing=null; sheetOpen=false; hideToast(); render(); window.scrollTo(0,0); }
document.querySelector("nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; go(b.dataset.tab); });
$("#syncDot").addEventListener("click",()=>toast($("#syncDot").title||"Loading…"));
$("#syncWarn").addEventListener("click",()=>{ toast("Your workouts are saved on this phone. They'll sync when the connection is back."); pushCloud(); });
function applySearch(){
  const q=exQuery.trim().toLowerCase(); let any=false; const groupsShown=new Set();
  document.querySelectorAll("#view [data-sr]").forEach(el=>{ const hit=!q || q.split(/\s+/).every(w=>el.dataset.sr.includes(w)); el.hidden=!hit; if(hit){ any=true; groupsShown.add(el.dataset.g); } });
  document.querySelectorAll("#view [data-grp]").forEach(el=>{ el.hidden = !!q && !groupsShown.has(el.dataset.grp); });
  const none=$("#exNone"); if(none) none.hidden = !q || any;
}
$("#view").addEventListener("input",e=>{
  if(e.target.id==="exSearch"){ exQuery=e.target.value; applySearch(); return; }
  if(e.target.id==="cName"){ const c=$("#cCount"); if(c) c.textContent=e.target.value.length+"/40"; return; }
  const i=e.target.closest("input[data-t]"); if(!i) return;
  const t=findTrack(i.dataset.t), lvl=sessionLevel(t), st=spec(t,lvl);
  drafts[t.id]=drafts[t.id]||sessionGoals(t,lvl,st).map(String);
  drafts[t.id][+i.dataset.i]=i.value.replace(/\D/g,"").slice(0,4);
  i.classList.toggle("hit", parseInt(i.value,10)>=+i.dataset.g);
});
$("#view").addEventListener("submit",e=>{
  if(e.target.id!=="addForm") return; e.preventDefault();
  const name=$("#cName").value.trim(); if(!name){ toast("Give it a name"); return; }
  const type=$("#cType").value;
  let min=Math.max(1,parseInt($("#cMin").value,10)||1), max=Math.max(1,parseInt($("#cMax").value,10)||min), sets=Math.min(6,Math.max(1,parseInt($("#cSets").value,10)||3));
  if(max<min) [min,max]=[max,min];
  const id="c"+Date.now().toString(36);
  state.custom.push({id,name,sets,min,max,unit:type==="sec"?"sec":"reps"});
  commit(); render(); toast(`${name} added. Find it on Today.`);
});
$("#view").addEventListener("change",e=>{
  const cb=e.target.closest("input[data-rt]"); if(!cb||!editing) return;
  editing.name=$("#rName")?.value ?? editing.name;
  cb.checked ? editing.items.add(cb.dataset.rt) : editing.items.delete(cb.dataset.rt);
  const n=$("#rCount"); if(n) n.textContent=editing.items.size;
});
$("#view").addEventListener("click",e=>{
  const swapButton=e.target.closest("[data-swap]");if(swapButton){handleSwap(swapButton);return;}
  const readinessButton=e.target.closest("[data-readiness]");if(readinessButton){handleReadiness(readinessButton);return;}
  const coachButton=e.target.closest("[data-coach]");if(coachButton){handleCoach(coachButton);return;}
  const focusButton=e.target.closest("[data-focus]"); if(focusButton){handleFocus(focusButton);return;}
  // whole-page controls
  const u=e.target.closest("[data-ui]");
  if(u){
    const a=u.dataset.ui;
    if(a==="min"){ if(hold){toast("Finish or cancel the running hold first.");return;} stopTimer(); hideToast(); minutes=+u.dataset.m; store.set("bwl-min",String(minutes)); showMore=false; render(); return; }
    if(a==="sheet"){ sheetOpen=true; render(); $(".sheet .opt[aria-pressed=true]")?.focus(); return; }
    if(a==="close"){ sheetOpen=false; render(); $(".showbtn")?.focus(); return; }
    if(a==="pick"){ if(hold){toast("Finish or cancel the running hold first.");return;} stopTimer(); hideToast(); filter=u.dataset.f; store.set("bwl-filter",filter); sheetOpen=false; showMore=false; render(); window.scrollTo(0,0); return; }
    if(a==="routines"){ routinesOpen=true; go("ladders"); return; }
    if(a==="more"){ showMore=!showMore; render(); return; }
    if(a==="rtoggle"){ routinesOpen=!routinesOpen; render(); return; }
    if(a==="done"){ showDone=!showDone; render(); return; }
    if(a==="ex"){ const id=u.dataset.t; expandedEx.has(id)?expandedEx.delete(id):expandedEx.add(id); confirmDel=null; render(); return; }
    if(a==="setup"){ setupDraft=null; setupWanted=true; go("setup"); return; }
    if(a==="onext"){setupMove(setupStage+1);return;}
    if(a==="oback"){setupMove(setupStage-1);return;}
    if(a==="oedit"){setupMove(+u.dataset.step);return;}
    if(a==="onone"){setupDraft.gear.clear();setupError="";saveSetupDraft();render();document.querySelector('[data-ui="onone"]')?.focus({preventScroll:true});return;}
    if(a==="stog"){ const k=u.dataset.kind,v=u.dataset.v;if(k==="level")setupDraft.level=v;else setupDraft[k].has(v)?setupDraft[k].delete(v):setupDraft[k].add(v);setupError="";saveSetupDraft();render();document.querySelector(`[data-ui="stog"][data-kind="${k}"][data-v="${v}"]`)?.focus({preventScroll:true});return; }
    if(a==="finish"){if(setupStage!==4)return;if(!setupDraft.groups.size||!setupHasExercises()){setupStage=!setupDraft.groups.size?1:2;setupError="Choose a focus and matching equipment before continuing.";render();return;}finishSetup(false);return;}
    if(a==="skip"){if(state.prefs.setupDone||state.log.length){setupDraft=null;setupStage=0;setupError="";setupWanted=false;go("today");}else finishSetup(true);return;}
    if(a==="gotoday"){ go("today"); return; }
    if(a==="forcesetup"){ setupWanted=true; go("setup"); return; }
    if(a==="selentry"){ const id=u.dataset.id; confirmDel = confirmDel==="e:"+id ? null : "e:"+id; render(); return; }
    if(a==="delentry"){
      const id=u.dataset.id;
      const gone=state.log.find(x=>entryId(x)===id);
      state.log=state.log.filter(x=>entryId(x)!==id); state.deleted=[...state.deleted,id].slice(-TOMB_KEEP); confirmDel=null;
      commit(); render();
      toast("Entry deleted.", gone ? ()=>{ state.deleted=state.deleted.filter(x=>x!==id); state.log=dedupe([...state.log,gone]); commit(); render(); toast("Entry restored."); } : null); return;
    }
  }
  const ra=e.target.closest("button[data-ract]");
  if(ra){

    if(act==="cancel"){ editing=null; confirmDel=null; render(); return; }

      const name=(editing.name||"").trim(); if(!name){ toast("Give the routine a name"); $("#rName")?.focus(); return; }
      if(!editing.items.size){ toast("Pick at least one exercise"); return; }
      const items=allTracks().map(t=>t.id).filter(id=>editing.items.has(id));
      let id=editing.id;
      if(id){ const r=state.routines.find(x=>x.id===id); r.name=name; r.items=items; }
      else { id="u"+Date.now().toString(36); state.routines.unshift({id, name, items}); }
      editing=null; filter="r:"+id; store.set("bwl-filter",filter); commit(); go("today"); toast(`Showing ${name}.`); return;
    }
    if(act==="delete"){
      const key="r:"+editing.id;
      if(confirmDel!==key){ confirmDel=key; render(); return; }
      state.routines=state.routines.filter(x=>x.id!==editing.id); if(filter===key) filter="All";
      editing=null; confirmDel=null; commit(); render(); toast("Routine deleted."); return;
    }
  }
  const b=e.target.closest("button[data-act]"); if(!b) return;
  const t=findTrack(b.dataset.t); if(!t) return;
  const lvl=sessionLevel(t), st=spec(t,lvl), act=b.dataset.act;
  if(hold?.focus && ["save","rest","hold","open","complete"].includes(act)){toast("Finish or cancel the running hold first.");return;}
  if(focusRun?.phase==="rest" && ["hold","rest"].includes(act)){toast("Skip the current rest before starting another timer.");return;}
  if(act!=="del") confirmDel=null;
  if(act==="complete"){
    if(hold && hold.tid===t.id){ toast("Finish or cancel the running hold first."); return; }
    const i=+b.dataset.i; const checked=completedSets[t.id]||(completedSets[t.id]=new Set());

  if(act==="open"){ const n=focusRun?.items.findIndex(x=>x.id===t.id&&!x.entry); if(n>=0&&!hold){stopTimer();focusRun.at=n;focusRun.phase="work";persistFocus();} opened.clear(); opened.add(t.id); render(); const c=document.getElementById("card-"+t.id); c?.scrollIntoView?.({block:"nearest",behavior:motionBehavior()}); c?.querySelector(".step-name")?.focus({preventScroll:true}); return; }
  if(act==="close"){ opened.delete(t.id); delete drafts[t.id]; delete holdNext[t.id]; delete completedSets[t.id]; if(hold&&hold.tid===t.id) stopTimer(); render(); document.querySelector(`.mini[data-t="${t.id}"]`)?.focus({preventScroll:true}); return; }
  if(act==="rest"){ if(hold){ toast("Stop or cancel the hold first."); return; } startRest(restOf(t,st)); }
  if(act==="hold"){ if(hold){ toast("Finish the current hold first."); return; } startHold(t); }
  if(act==="save") saveSets(t);
  if(act==="up"){ setLevel(t.id,lvl+1); toast(`New step: ${t.steps[lvl+1][0]}`); }
  if(act==="down"){ setLevel(t.id,lvl-1); toast(`Moved to ${t.steps[lvl-1][0]}. Build up from here.`); }
  if(act==="set"){ setLevel(t.id,+b.dataset.l); toast(`Starting at ${t.steps[+b.dataset.l][0]}`); }
  if(act==="focus"){ state.prefs.focus[t.id]=b.dataset.f; commit(); render(); }
  if(act==="setsInc"||act==="setsDec"){ if(hold&&hold.tid===t.id) stopTimer(); const n=Math.min(6,Math.max(1,st[1]+(act==="setsInc"?1:-1))); state.prefs.sets[t.id]=n; delete drafts[t.id]; delete holdNext[t.id]; delete completedSets[t.id]; commit(); render(); }
  if(act==="hide"){ state.prefs.hidden[t.id]=true; expandedEx.delete(t.id); commit(); render(); toast(`${t.name} hidden. Add it back under Hidden.`); }
  if(act==="show"){ delete state.prefs.hidden[t.id]; commit(); render(); toast(`${t.name} is back on Today.`); }
  if(act==="del"){
    if(confirmDel!==t.id){ confirmDel=t.id; render(); return; }
    state.custom=state.custom.filter(c=>c.id!==t.id); state.routines.forEach(r=>r.items=r.items.filter(id=>id!==t.id)); delete state.prefs.focus[t.id]; delete state.prefs.sets[t.id]; confirmDel=null;
    commit(); render(); toast(`${t.name} deleted.`);
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && sheetOpen){ sheetOpen=false; render(); $(".showbtn")?.focus(); } });

/* ---------- rest + hold timer (one pill at the bottom) ---------- */
let restEnd=0, restTick=null, wake=null, hold=null, buzzed=false;
async function grabWake(){
  try{ if(navigator.wakeLock && !wake){ wake=await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{ wake=null; }); } }catch(e){ wake=null; }
}
// A short beep as well as a buzz, because iPhones can't vibrate from a web page
let actx=null;
function primeAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(n){ try{ if(!actx) return; for(let i=0;i<n;i++){ const o=actx.createOscillator(), g=actx.createGain(), t0=actx.currentTime+i*0.22; o.frequency.value=880; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.25,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18); o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+0.2); } }catch(e){} }
const buzz = p => { try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} beep(p.length>1?2:1); };
function showTimer(html){ const el=$("#timer"); el.innerHTML=html; el.hidden=false; document.body.classList.add("timing"); }
function startRest(sec,deadline){
  primeAudio();
  hold=null; restEnd=Number.isFinite(deadline)?deadline:Date.now()+sec*1000; buzzed=false;
  showTimer(`<span class="tlabel">Rest</span><span id="timerText"></span><button data-tm="add">+30s</button><button data-tm="stop">Skip</button>`);
  tick(); clearInterval(restTick); restTick=setInterval(tick,250); grabWake();
}
function startHold(t, side){
  primeAudio();
  const lvl=sessionLevel(t), st=spec(t,lvl), i=holdNext[t.id]??0, g=sessionGoals(t,lvl,st)[i];
  const sides = st[4].includes("each") ? 2 : 1;
  hold={tid:t.id, i, goal:g, start:Date.now()+3000, side:side||1, sides, first:hold?.first}; buzzed=false;
  const label = `Set ${i+1}${sides>1?` · side ${hold.side}`:""}`;
  showTimer(`<span class="tlabel">${label}</span><span id="timerText"></span><button data-tm="done">Stop</button><button data-tm="cancel" aria-label="Cancel hold">✕</button>`);
  tick(); clearInterval(restTick); restTick=setInterval(tick,200); grabWake();
}
function tick(){
  const tx=$("#timerText"); if(!tx) return;
  if(hold){
    const el=(Date.now()-hold.start)/1000;
    const doneBtn=$("#timer [data-tm=done]"); if(doneBtn) doneBtn.hidden = el<0;
    if(hold.focus){const clock=$("#focusClock");if(clock)clock.textContent=el<0?"Ready "+Math.ceil(-el):Math.floor(el)+"s";const finish=$("[data-focus=finish]");if(finish)finish.disabled=el<0;}
    if(el<0){ tx.textContent="Get ready "+Math.ceil(-el); return; }
    const s=Math.floor(el); tx.textContent=`${s}s / ${hold.goal}s`;
    $("#timer").classList.toggle("reached", s>=hold.goal);
    if(s>=hold.goal && !buzzed){ buzzed=true; buzz([150,80,150]); }
    return;
  }
  const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));
  tx.textContent=Math.floor(left/60)+":"+pad2(left%60);
  if(focusRun?.phase==="rest"){
    const clock=$("#focusClock");if(clock)clock.textContent=focusTime(left);
    const arc=$("#focusArc");if(arc)arc.setAttribute("stroke-dashoffset",String(focusRestOffset()));
  }
  if(left===0){ const focusRest=focusRun?.phase==="rest";stopTimer(); buzz([200,100,200]);if(focusRest)resumeFocus();toast("Rest done. Next set."); }
}
function finishHold(){
  const h=hold; if(!h) return; const t=findTrack(h.tid); if(!t){ stopTimer(); return; }
  const raw=(Date.now()-h.start)/1000;
  if(raw<0){ stopTimer(); toast("Hold cancelled."); return; }          // stopped during the countdown
  const lvl=sessionLevel(t), st=spec(t,lvl);
  if(h.i>=st[1]){ stopTimer(); return; }
  let secs=Math.floor(raw); const cap=Math.max(h.goal*3,120);
  if(secs>cap){ secs=cap; toast(`Capped at ${cap}s. Fix the number if that's wrong.`); }
  if(h.sides>1 && h.side===1){                                          // time the other side next
    hold={...h, first:secs}; stopTimer(); hold=null;
    const keep={first:secs}; startHold(t,2); hold.first=keep.first; if(h.focus){hold.focus=true;hold.goal=h.goal;render();} return;
  }
  if(h.sides>1) secs=Math.min(secs, h.first ?? secs);                    // count the weaker side
  if(h.focus){stopTimer();completeFocus(secs);return;}
  drafts[t.id]=drafts[t.id]||sessionGoals(t,lvl,st).map(String);
  drafts[t.id][h.i]=String(secs); holdNext[t.id]=h.i+1; opened.add(t.id);
  (completedSets[t.id]||(completedSets[t.id]=new Set())).add(h.i);
  stopTimer(); softRender();
  if(h.i+1<st[1]) startRest(restOf(t,st)); else toast("All sets timed. Tap Save.");
}
function stopTimer(){ clearInterval(restTick); restTick=null; hold=null; const el=$("#timer"); el.hidden=true; el.classList.remove("reached"); document.body.classList.remove("timing"); try{ wake&&wake.release(); }catch(e){} wake=null; }
$("#timer").addEventListener("click",e=>{
  const b=e.target.closest("[data-tm]"); if(!b) return;
  const a=b.dataset.tm;
  if(a==="add"){if(focusRun?.phase==="rest")addFocusRest();else{restEnd+=30000;tick();}}
  if(a==="stop"||a==="cancel"){if(focusRun?.phase==="rest")resumeFocus();else{const focused=hold?.focus;stopTimer();if(focused)render();}}
  if(a==="done") finishHold();
});

/* ---------- keep things fresh ---------- */
const typing = () => document.activeElement?.matches?.("input,select,textarea");
let renderLater=false;
function softRender(){ if(typing() || sheetOpen){ renderLater=true; return; } renderLater=false; render(); }
document.addEventListener("focusout",()=>{ setTimeout(()=>{ if(renderLater) softRender(); },0); });
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  setDate();
  if(restTick){ tick(); grabWake(); }
  if(sync==="error") pushCloud();
  if(tab==="today") softRender();
});
setInterval(()=>{ setDate(); if(tab==="today") softRender(); },60000);

/* ---------- boot ---------- */
const local = loadLocal(); if(local){ state = local; saveLocal(); } remember();  // saves repaired records right away
for(const [id,name]of [['tab-today','work'],['tab-ladders','exercises'],['tab-history','progress']])document.getElementById(id).insertAdjacentHTML('afterbegin',uiGlyph(name));
$('.nav-brand').insertAdjacentHTML('afterbegin',uiGlyph('keep'));
$('header.top').insertAdjacentHTML('afterbegin',`<span class="app-brand-mark" aria-hidden="true">${uiGlyph('keep')}</span>`);
render(); setNote();
(async()=>{
  let dbApi=null, uid=null;
  try{
    dbApi = await window.claude?.use?.("db");
    const user = await window.claude?.use?.("user");
    uid = user ? await user.id() : null;
  }catch(e){}
  if(!dbApi || !uid){ setSync("local"); return; }
  connect(dbApi.doc("data/users/"+uid+"/state"));
})();
async function connect(ref){
  setSync("syncing");
  let remote=null;
  for(let a=0;a<2 && remote===null;a++){
    try{ const snap=await ref.get(); remote = snap.exists ? normalize(snap.data()) : false; }
    catch(e){ if(a===0) await new Promise(r=>setTimeout(r,1500+Math.random()*1500)); }
  }
  if(remote===null){ setSync("error"); setTimeout(()=>connect(ref),30000); return; }
  // Join this device's copy (including anything logged while we waited) with the cloud copy
  const merged = remote ? merge(state, remote) : state;
  const changedHere = !sameData(state, merged);
  state = merged; remember(); saveLocal();
  docRef = ref;
  if(!remote || !sameData(merged, remote)) pushCloud(); else setSync("ok");
  if(changedHere || tab!=="today") softRender();
  // Live updates from your other devices
  listen(ref);
}
function listen(ref){
  try{
    ref.onSnapshot(snap=>{
      if(!snap.exists || snap.metadata.hasPendingWrites) return;
      const other = normalize(snap.data());
      const m = merge(state, other);
      if(!sameData(m, state)){ state = m; remember(); saveLocal(); softRender(); }
      if(!sameData(m, other)) pushCloud();
    }, ()=>{ setTimeout(()=>{ if(docRef) listen(ref); }, 5000); });
  }catch(e){}
}
</script>
